<script>
/* ===== GitHub Pages version: connection to the Apps Script back end =====
   Paste the web app's /exec link below (Apps Script → Deploy → Manage deployments → Web app URL). */
var KP_API_URL = 'https://script.google.com/macros/s/AKfycbxZqnmFgsB3IaHqwAbJlovsCH1zXitzfKBCqJuauKg/exec';
window.KP_STANDALONE = true;
(function () {
  // deep links work here too: ?action=complete&t=… (Booking QR) / ?action=class&c=… (Class QR)
  var q = new URLSearchParams(location.search), app = document.getElementById('app');
  var act = q.get('action') || '', ok = /^[A-Za-z0-9_-]{16,64}$/;
  if (act === 'complete' && ok.test(q.get('t') || '')) { app.dataset.action = act; app.dataset.qr = q.get('t'); }
  if (act === 'class' && ok.test(q.get('c') || '')) { app.dataset.action = act; app.dataset.qr = q.get('c'); }
  if (act) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
  // google.script.run → POST {fn, args} to the Apps Script doPost
  function callApi(fn, args, ok, fail) {
    fetch(KP_API_URL, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (j) {
        if (j && j.error) { if (fail) fail(new Error(j.error)); return; }
        var res = j ? j.result : null;
        if (fn === 'getInitData' && res && res.ok) res.scannerUrl = '';   // scan with the camera in this page
        if (ok) ok(res);
      })
      .catch(function (e) { if (fail) fail(new Error('Cannot reach the booking server. Please check the internet connection and try again. (' + (e && e.message || e) + ')')); });
  }
  function runner(ok, fail) {
    return new Proxy({}, { get: function (t, name) {
      if (name === 'withSuccessHandler') return function (f) { return runner(f, fail); };
      if (name === 'withFailureHandler') return function (f) { return runner(ok, f); };
      return function () { callApi(String(name), Array.prototype.slice.call(arguments), ok, fail); };
    } });
  }
  window.google = { script: { run: runner(null, null) } };
})();
</script>
<script>
/* =========================================================================
   Keryx Pilates – client-side app (vanilla JS, single page)      Version 3.2
   All user/sheet text is inserted with textContent (never raw innerHTML).
   ========================================================================= */
(function () {
  'use strict';

  // ---------------------------------------------------------------- constants
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTHS_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var DOW_MON = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var PALETTE = ['#5E8C7A','#C47A5A','#6A7FB5','#B5869E','#C9A24A','#4F9AA8','#8A6FB0'];
  var NO_TRAINER = 'No Trainer';
  var BOOKED = 'Booked', CANCELLED = 'Cancelled', CHECKED_IN = 'Checked in', NO_SHOW = 'No show';
  /** Cancelled, Late cancelled or Studio cancelled. */
  function isCancelled(st) { return /cancelled$/i.test(String(st || '')); }

  var $ = function (id) { return document.getElementById(id); };

  var state = {
    token: null,          // sign-in session (kept in this browser for 6 hours)
    user: null,           // { id, name, phone, email, role: Customer | Trainer | Admin }
    si: {},               // sign-in / registration steps
    init: null,
    page: null,
    bookForm: null,
    cancel: { query: '', items: [], filter: BOOKED, selected: {}, searched: false, inflight: '' },
    cal: { view: 'month', anchor: '', data: null, range: null, cache: {} },
    filters: { trainer: null, sstatus: null },
    edit: { booking: null, form: null },
    md: { name: '', data: null, edits: {}, orig: {}, adds: [] }
  };

  // ---------------------------------------------------------------- DOM helpers
  function el(tag, attrs) {
    var n = document.createElement(tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') n.className = v;
        else if (k === 'text') n.textContent = v;
        else if (k === 'style') n.setAttribute('style', v);
        else if (k === 'value') n.value = v;
        else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
        else if (k === 'checked' || k === 'disabled') n[k] = !!v;
        else n.setAttribute(k, v === true ? '' : v);
      });
    }
    for (var i = 2; i < arguments.length; i++) append(n, arguments[i]);
    return n;
  }
  function append(n, c) {
    if (c === null || c === undefined || c === false) return;
    if (Array.isArray(c)) { c.forEach(function (x) { append(n, x); }); return; }
    n.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  function icon(name) { return el('span', { class: 'ms', 'aria-hidden': 'true' }, name); }
  /**
   * Search box with a clear (x) button on the right.
   * wrap = .search-box element containing an input and a .search-x button.
   */
  function bindClear(wrap, onChange) {
    var inp = wrap.querySelector('input'), x = wrap.querySelector('.search-x');
    var sync = function () { x.hidden = !inp.value; };
    inp.addEventListener('input', function () { sync(); onChange(inp.value); });
    // clear and stop typing (the phone keyboard closes)
    x.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keeps the click from stealing focus first
    x.addEventListener('click', function () { inp.value = ''; sync(); onChange(''); inp.blur(); x.blur();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });
    sync();
    return { set: function (v) { inp.value = v || ''; sync(); } };
  }
  /**
   * Adds the same clear (x) button to an ordinary text box (already on the page).
   * Pressing it empties the box, lets the page react as if the user deleted the
   * text (an "input" event), and stops typing (the phone keyboard closes).
   */
  function addClearX(inp, onClear) {
    if (!inp || !inp.parentNode || inp.readOnly) return;
    var wrap = el('div', { class: 'clear-box' });
    inp.parentNode.insertBefore(wrap, inp);
    wrap.appendChild(inp);
    var x = el('button', { class: 'search-x', type: 'button', 'aria-label': 'Clear', tabindex: '-1' }, icon('close'));
    wrap.appendChild(x);
    var sync = function () { x.hidden = !inp.value || inp.readOnly; };
    inp.addEventListener('input', sync);
    x.addEventListener('mousedown', function (e) { e.preventDefault(); });
    x.addEventListener('click', function () {
      inp.value = '';
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      if (onClear) onClear();                       // e.g. booking: clear phone AND name together
      sync(); inp.blur(); x.blur();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();   // stop typing anywhere
    });
    sync();
    return { sync: sync };
  }
  function searchBox(id, placeholder, value, onChange) {
    var wrap = el('div', { class: 'search-box' }, icon('search'),
      el('input', { id: id, type: 'text', autocomplete: 'off', placeholder: placeholder, value: value || '', 'aria-label': placeholder }),
      el('button', { class: 'search-x', type: 'button', 'aria-label': 'Clear' }, icon('close')));
    bindClear(wrap, onChange);
    return wrap;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); return n; }
  function fillSelect(sel, options, placeholder) {
    clear(sel);
    if (placeholder !== null) sel.appendChild(el('option', { value: '' }, placeholder));
    options.forEach(function (o) { sel.appendChild(el('option', { value: o.value }, o.label)); });
  }

  // ---------------------------------------------------------------- date helpers (yyyy-MM-dd strings, UTC maths)
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function keyToUTC(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
  function utcToKey(d) { return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
  function addDays(k, n) { var d = keyToUTC(k); d.setUTCDate(d.getUTCDate() + n); return utcToKey(d); }
  function addMonths(k, n) { var d = keyToUTC(k.slice(0, 8) + '01'); d.setUTCMonth(d.getUTCMonth() + n); return utcToKey(d); }
  function dow(k) { return keyToUTC(k).getUTCDay(); }
  function startOfWeek(k) { return addDays(k, -((dow(k) + 6) % 7)); }   // Monday
  function lastOfMonth(k) { var d = keyToUTC(k.slice(0, 8) + '01'); return utcToKey(new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0))); }
  function fmtDate(k) { var d = keyToUTC(k); return pad(d.getUTCDate()) + '-' + MONTHS[d.getUTCMonth()] + '-' + d.getUTCFullYear(); }
  function fmtDateLong(k) { return DOW[dow(k)] + ', ' + fmtDate(k); }
  function idxStart(i) { return pad(i - 1) + ':00'; }
  function idxEnd(i) { return pad(i % 24) + ':00'; }
  function fmtMoney(n) { return '฿' + Number(n || 0).toLocaleString('en-US'); }
  /** Signed price adjustment: −฿500 (discount) / +฿300 (increase) / ฿0 */
  function fmtAdj(n) {
    n = Number(n) || 0;
    return n < 0 ? '−' + fmtMoney(-n) + ' (discount)' : n > 0 ? '+' + fmtMoney(n) + ' (increase)' : fmtMoney(0);
  }

  // ---------------------------------------------------------------- phone helpers (stored as 10 digits, shown as xxx-xxx-xxxx)
  function phoneDigits(v) { return String(v || '').replace(/\D/g, '').slice(0, 10); }
  function fmtPhone(v) {
    var d = phoneDigits(v);
    if (d.length > 6) return d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6);
    if (d.length > 3) return d.slice(0, 3) + '-' + d.slice(3);
    return d;
  }
  /** Re-formats an input as xxx-xxx-xxxx while typing, keeping the caret in place. */
  function formatPhoneInput(input) {
    var raw = input.value, pos = input.selectionStart || raw.length;
    var digitsBefore = phoneDigits(raw.slice(0, pos)).length;
    input.value = fmtPhone(raw);
    var p = 0, seen = 0;
    while (p < input.value.length && seen < digitsBefore) { if (/\d/.test(input.value.charAt(p))) seen++; p++; }
    try { input.setSelectionRange(p, p); } catch (e) { /* not focused */ }
  }

  // ---------------------------------------------------------------- server calls
  var pending = 0;
  function setLoading(on) {
    pending = Math.max(0, pending + (on ? 1 : -1));
    $('loading').hidden = pending === 0;
    document.body.classList.toggle('busy', pending > 0);
  }
  function run(quiet, fn, args) {
    return new Promise(function (resolve, reject) {
      if (!quiet) setLoading(true);
      var runner = google.script.run
        .withSuccessHandler(function (r) { if (!quiet) setLoading(false); resolve(r); })
        .withFailureHandler(function (e) { if (!quiet) setLoading(false); reject(e); });
      runner[fn].apply(runner, args);
    });
  }
  /** Server call with the loading spinner. */
  function call(fn) { return run(false, fn, Array.prototype.slice.call(arguments, 1)); }
  /** Server call in the background (no spinner) – used for the customer look-up. */
  function callQuiet(fn) { return run(true, fn, Array.prototype.slice.call(arguments, 1)); }

  function handleError(err) {
    var msg = (err && err.message) ? err.message : String(err || 'Unknown error');
    if (msg.indexOf('SESSION_EXPIRED') !== -1) {
      var phone = state.user ? state.user.phone : '';
      endSession();
      return modal('Please sign in again', 'Your session has ended.').then(function () { showSignin(phone); });
    }
    if (msg.indexOf('NOT_ALLOWED') !== -1) {
      // the admin may have changed this user's role – reload what they may see
      return modal('Not available', 'This function is not available for your role.').then(function () {
        return loadInit().then(goMenu);
      });
    }
    console.error(err);
    return modal('Something went wrong', 'Please try again. (' + msg + ')');
  }

  // ---------------------------------------------------------------- modal / toast
  var modalResolve = null;
  function modal(title, body, buttons) {
    return new Promise(function (resolve) {
      if (modalResolve) { var prev = modalResolve; modalResolve = null; prev(false); }
      modalResolve = resolve;
      $('modal-title').textContent = title;
      var b = clear($('modal-body'));
      if (typeof body === 'string' && body) b.appendChild(el('p', null, body));
      else if (body && typeof body === 'object') b.appendChild(body);
      var act = clear($('modal-actions'));
      act.classList.toggle('many', (buttons || []).length > 2);   // 3+ buttons → equal 2-column grid
      (buttons || [{ label: 'Ok', value: true, kind: 'primary' }]).forEach(function (btn) {
        act.appendChild(el('button', {
          class: 'btn ' + (btn.kind || 'ghost'), type: 'button',
          onclick: function () { closeModal(btn.value); }
        }, btn.label));
      });
      $('modal-root').hidden = false;
      var focus = act.querySelector('.primary, .danger') || act.lastChild;
      if (focus) focus.focus();
    });
  }
  function closeModal(value) {
    $('modal-root').hidden = true;
    var r = modalResolve; modalResolve = null;
    if (r) r(value);
  }
  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function kv(rows, cls) {
    var dl = el('dl', { class: 'kv' + (cls ? ' ' + cls : '') });
    rows.forEach(function (r) { dl.appendChild(el('dt', null, r[0])); dl.appendChild(el('dd', null, r[1] === '' || r[1] == null ? '–' : r[1])); });
    return dl;
  }
  /** Booking Status badge: Booked / Checked in / No show / Cancelled. */
  function badge(status) {
    var cls = isCancelled(status) ? 'cancelled' : status === CHECKED_IN ? 'checkedin' : status === NO_SHOW ? 'noshow' : 'booked';
    return el('span', { class: 'badge ' + cls }, status || '–');
  }
  /** Class Status badge: Not Completed / Completed / Cancelled. */
  function ssBadge(s) {
    if (!s) return el('span', { class: 'muted' }, '–');
    var cls = s === 'Completed' ? 'done' : s === 'Cancelled' ? 'cx' : s === 'Scheduled' ? 'sched' : s === 'Not held' ? 'nothe' : 'not';
    return el('span', { class: 'ss ' + cls }, s);
  }

  // ---------------------------------------------------------------- router
  function show(page) {
    document.querySelectorAll('.page').forEach(function (p) { p.hidden = p.id !== 'page-' + page; });
    if (page !== 'scan') stopCamera();               // never leave the camera running
    state.page = page;
    $('app').classList.toggle('wide', page === 'calendar' || page === 'master');
    window.scrollTo(0, 0);
  }
  function goMenu() { if (!state.user) return showSignin(''); renderMenu(); show('menu'); }
  /** Role of the signed-in user (M_User[Role]). The server checks it again on every call. */
  function role() { return state.user ? state.user.role : ''; }
  function isAdmin() { return role() === 'Admin'; }
  /** Trainer or admin. Trainers have no Master Data and never see prices. */
  function isStaff() { return role() === 'Admin' || role() === 'Trainer'; }
  /** Session token sent with every server call. */
  function auth() { return state.token; }

  // ---------------------------------------------------------------- start-up
  function start() {
    bindEvents();
    var saved = null;
    try { saved = localStorage.getItem('kp_session'); } catch (e) { saved = null; }
    if (!saved) return showSignin('');
    // reopened app: still signed in? (sessions last 6 hours)
    call('whoAmI', saved).then(function (r) {
      if (!r.ok) { setSession(null, null); return showSignin(''); }
      setSession(saved, r.user);
      return loadInit().then(function () { goMenu(); runPendingQr(); });
    }).catch(function (e) { setSession(null, null); showSignin(''); console.error(e); });
  }

  /** Loads services, opening hours etc. for the signed-in user. */
  function loadInit() {
    return call('getInitData', state.token).then(applyInit);
  }

  /** Stores start-up data and (re)builds the calendar filters. */
  function applyInit(d) {
    state.init = d;
    if (d.user) { state.user = d.user; renderWho(); }     // role may have been changed by an admin
    $('app-version').textContent = d.version ? 'Version ' + d.version : 'Version unknown – server code is out of date';
    state.filters.trainer = MultiSelect($('cv-trainer'), {
      title: 'Trainer', icon: 'person', items: function () { return state.init.trainers; },
      swatch: colorFor, onChange: renderCalendar
    });
    state.filters.sstatus = MultiSelect($('cv-sstatus'), {
      title: 'Class Status', icon: 'task_alt', items: function () { return state.init.classStatuses || []; },
      onChange: renderCalendar
    });
  }

  function bindEvents() {
    $('sign-out').addEventListener('click', signOut);
    // scan to complete service
    $('sc-file').addEventListener('change', onPhoto);
    $('sc-back').addEventListener('click', goMenu);
    // round QR button → two small buttons above it: Camera / Photo upload
    // with the Live QR Scanner set up (Code.gs SCANNER_URL) the button goes straight to it, no small buttons
    $('scan-fab').addEventListener('click', function (e) {
      e.stopPropagation();
      openCamera();
    });
    // a photo was chosen → read it; cancelled (no photo) → stay on the main menu
    var photoChosen = function (e) { if (!(e.target.files && e.target.files.length)) return; show('scan'); prepScanPage(); onPhoto(e); };
    $('fab-photo').addEventListener('change', photoChosen);
    $('fab-file').addEventListener('change', photoChosen);
    $('sc-again').addEventListener('click', function () {
      if (state.init && state.init.scannerUrl) return openCamera();          // live scanner page
      if (liveCameraBlocked()) $('fab-file').click(); else openScan();
    });
    $('sc-upload').addEventListener('click', function () { $('fab-photo').click(); });     // same as "Upload photo" on the menu

    // back arrows in page headers
    document.querySelectorAll('[data-back]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (state.page === 'book') backFromBooking();
        else if (state.page === 'master') backFromMaster();
        else goMenu();
      });
    });

    // booking page
    $('bk-confirm').addEventListener('click', confirmBooking);
    $('bk-back').addEventListener('click', backFromBooking);

    // cancellation page: text filter (in the browser) + date range (from the server)
    state.cxClear = bindClear(document.querySelector('#cx-search-box .search-box'), function (v) {
      state.cancel.text = v; state.cancel.selected = {}; renderCancelList();
    });
    $('cx-from').addEventListener('change', loadBookings);
    $('cx-to').addEventListener('change', loadBookings);
    $('cx-classqr').addEventListener('click', chooseClassQr);
    $('cx-filter').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.cancel.filter = b.dataset.f; state.cancel.selected = {};
      setSeg('cx-filter', 'f', b.dataset.f); renderCancelList();
    });
    $('cx-all').addEventListener('change', function (e) {
      state.cancel.selected = {};
      if (e.target.checked) visibleCancelItems().forEach(function (b) { if (isSelectable(b)) state.cancel.selected[b.key] = true; });
      renderCancelList();
    });
    $('cx-cancel').addEventListener('click', function () { cancelSelected(''); });
    $('cx-back').addEventListener('click', goMenu);

    // calendar
    $('cv-views').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      state.cal.view = b.dataset.v; setSeg('cv-views', 'v', b.dataset.v); loadCalendar();
    });
    $('cv-prev').addEventListener('click', function () { moveCalendar(-1); });
    $('cv-next').addEventListener('click', function () { moveCalendar(1); });
    $('cv-today').addEventListener('click', function () { state.cal.anchor = state.init.today; loadCalendar(); });
    $('cv-month').addEventListener('change', jumpToMonth);
    $('cv-year').addEventListener('change', jumpToMonth);
    $('cv-cancelled').addEventListener('change', renderCalendar);
    $('cv-back').addEventListener('click', goMenu);
    document.addEventListener('click', function (e) {
      ['trainer', 'sstatus'].forEach(function (k) {
        var m = state.filters[k];
        if (m && m.isOpen() && !m.contains(e.target)) m.close();
      });
    });

    // edit pop-up
    $('edit-cancel').addEventListener('click', closeEdit);
    $('edit-confirm').addEventListener('click', confirmEdit);

    // master data
    $('md-table').addEventListener('change', onMasterSelect);
    $('md-view').addEventListener('click', function (e) { var b = e.target.closest('button[data-v]'); if (b) switchMdView(b.dataset.v); });
    $('md-back').addEventListener('click', backFromMaster);
    $('md-discard').addEventListener('click', function () {
      modal('Discard changes?', 'Your unsaved changes will be lost.', [{ label: 'Keep editing', value: false }, { label: 'Discard', value: true, kind: 'danger' }])
        .then(function (yes) { if (yes) { resetMasterEdits(); renderMaster(); } });
    });
    $('md-save').addEventListener('click', saveMaster);

    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      if (!$('modal-root').hidden) closeModal(false);              // = "No" / close
      else if (!$('edit-root').hidden) closeEdit();
      else ['trainer', 'sstatus'].forEach(function (k) { var m = state.filters[k]; if (m) m.close(); });
    });
  }

  function setSeg(id, attr, value) {
    $(id).querySelectorAll('button').forEach(function (b) {
      var on = b.dataset[attr] === value;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }

  // ================================================================ SIGN IN / REGISTER
  /**
   * Steps (all inside #si-card):
   *   phone   – telephone number; known → "Welcome back {name}" + Log in,
   *             new → "Welcome, please register" + name + email + Register
   *   pin     – sign-in PIN
   *   otp     – 6-digit code from the email, 5-minute countdown, max 5 tries
   *   setpin  – choose a PIN (new customer / account without PIN)
   * Forgot PIN (existing user): code to the email on file → otp → setpin (si.mode 'reset').
   */
  var PIN_LEN = +($('app').dataset.pinlen) || 6;
  var OTP_SECONDS = +($('app').dataset.otp) || 300;

  function showSignin(phone) {
    stopOtpTimer();
    state.si = { phone: phoneDigits(phone || ''), lookup: null, looked: '', name: '', email: '', emailMasked: '' };
    $('si-version').textContent = $('app').dataset.version ? 'Version ' + $('app').dataset.version : '';
    siPhoneStep();
    show('signin');
  }

  function digitBox(id, label, auto) {
    var inp = el('input', { id: id, type: 'password', inputmode: 'numeric', autocomplete: auto || 'off',
      maxlength: String(PIN_LEN), placeholder: '••••••', class: 'pin-in' });
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, PIN_LEN); });
    return { input: inp, field: el('label', { class: 'field' }, el('span', null, label), inp) };
  }
  function siTitle(t, sub) {
    return [el('h1', { class: 'title' }, t), sub ? el('p', { class: 'muted si-sub' }, sub) : null];
  }
  function onEnter(inp, fn) { inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') fn(); }); }

  // ---- step 1: telephone number
  function siPhoneStep() {
    var si = state.si, card = clear($('si-card'));
    var phone = el('input', { id: 'si-phone', type: 'tel', inputmode: 'numeric', autocomplete: 'tel', maxlength: '12', placeholder: '081-234-5678', value: fmtPhone(si.phone) });
    var msg = el('p', { class: 'si-msg', id: 'si-msg', 'aria-live': 'polite' });
    var err = el('small', { class: 'err' });
    var reg = el('div', { class: 'si-reg', hidden: true });
    var name = el('input', { id: 'si-name', type: 'text', autocomplete: 'name', maxlength: '100', placeholder: 'Your name' });
    var email = el('input', { id: 'si-email', type: 'email', autocomplete: 'email', maxlength: '120', placeholder: 'name@example.com' });
    var emailHint = el('small', { class: 'hint' });
    append(reg, [
      el('label', { class: 'field' }, el('span', null, 'User Name'), name),
      el('label', { class: 'field' }, el('span', null, 'Email Address'), email, emailHint)
    ]);
    var go = el('button', { class: 'btn primary block', type: 'button', id: 'si-go', disabled: true }, 'Log in');
    var forgot = el('button', { class: 'link-btn si-forgot', type: 'button', id: 'si-forgot', hidden: true }, 'Forgot PIN?');
    var title = siTitle('Sign in', 'Enter your telephone number to continue.');
    append(card, [
      title,
      el('label', { class: 'field' }, el('span', null, 'Telephone Number'), phone, err),
      msg, reg, go, forgot
    ]);
    title[0].id = 'si-title';
    addClearX(phone);

    function render() {
      var r = si.lookup, d = phoneDigits(phone.value);
      msg.className = 'si-msg';
      reg.hidden = true;
      var isNew = !!(r && si.looked === d && r.state === 'register' && d.length === 10);
      title[0].textContent = isNew ? 'Sign up' : 'Sign in';
      title[1].textContent = isNew ? 'Create your account – it only takes a minute.' : 'Enter your telephone number to continue.';
      go.disabled = true;
      go.textContent = 'Log in';
      forgot.hidden = true;
      if (d.length !== 10 || !r || si.looked !== d) { msg.textContent = d.length === 10 ? 'Checking…' : ''; return; }
      if (r.state === 'signin') {
        msg.textContent = 'Welcome back ' + r.name;
        msg.classList.add('ok');
        go.disabled = false;
        forgot.hidden = false;
      } else if (r.state === 'inactive') {
        msg.textContent = 'This account is inactive. Please contact the studio.';
        msg.classList.add('bad');
      } else {
        // new customer, or an account the studio created (no PIN yet)
        msg.textContent = r.state === 'setup' ? 'Welcome ' + r.name + ', please set up your account' : 'Welcome, please register';
        msg.classList.add('ok');
        reg.hidden = false;
        if (r.state === 'setup' && !name.value) name.value = r.name;
        emailHint.textContent = r.state === 'setup' && r.emailOnFile
          ? 'Use the email address the studio has on file (' + r.emailMasked + '). We\'ll send you a code.'
          : 'We\'ll send a 6-digit code to this email address.';
        go.textContent = 'Register';
        go.disabled = !(name.value.trim() && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim()));
      }
    }
    function lookup() {
      var d = phoneDigits(phone.value);
      if (d.length !== 10 || d === si.looked) { render(); return; }
      si.looked = d; si.lookup = null; render();
      callQuiet('lookupUser', d).then(function (r) {
        if (phoneDigits(phone.value) !== d || state.page !== 'signin') return;
        if (!r.ok) { si.looked = ''; err.textContent = r.message; return; }
        si.lookup = r; render();
      }).catch(function (e) { si.looked = ''; handleError(e); });
    }
    function submit() {
      var d = phoneDigits(phone.value), r = si.lookup;
      if (d.length !== 10) { err.textContent = 'Please enter a 10-digit telephone number.'; return; }
      if (!r || si.looked !== d || go.disabled) return;
      si.phone = d;
      if (r.state === 'signin') { si.name = r.name; return siPinStep(); }
      si.name = name.value.trim().replace(/\s+/g, ' ');
      si.email = email.value.trim().toLowerCase();
      startRegistration();
    }

    phone.addEventListener('input', function () {
      formatPhoneInput(phone); err.textContent = '';
      if (phoneDigits(phone.value).length < 10) si.looked = '';
      lookup();
    });
    phone.addEventListener('blur', function () {
      var d = phoneDigits(phone.value);
      err.textContent = d && d.length !== 10 ? 'Please enter a 10-digit telephone number (xxx-xxx-xxxx).' : '';
    });
    name.addEventListener('input', render);
    email.addEventListener('input', render);
    [phone, name, email].forEach(function (i) { onEnter(i, submit); });
    go.addEventListener('click', submit);
    forgot.addEventListener('click', function () {
      var d = phoneDigits(phone.value), r = si.lookup;
      if (!r || si.looked !== d || r.state !== 'signin') return;
      si.phone = d; si.name = r.name;
      startPinReset();
    });
    if (si.phone.length === 10) lookup();
    setTimeout(function () { phone.focus(); }, 50);
  }

  /** Forgot PIN: a code goes to the email address on file. */
  function startPinReset() {
    var si = state.si;
    return call('startPinReset', si.phone).then(function (r) {
      if (!r.ok) return modal(r.code === 'NO_EMAIL' ? 'No email on file' : 'Please check', r.message);
      si.mode = 'reset';
      si.emailMasked = r.emailMasked;
      si.otpUntil = Date.now() + (r.seconds || OTP_SECONDS) * 1000;
      si.resendAt = Date.now() + 30000;
      siOtpStep();
    }).catch(handleError);
  }

  function startRegistration() {
    var si = state.si;
    si.mode = 'reg';
    return call('startRegistration', si.phone, si.name, si.email).then(function (r) {
      if (!r.ok) return modal(r.code === 'EXISTS' ? 'Already registered' : 'Please check', r.message)
        .then(function () { if (r.code === 'EXISTS') { si.looked = ''; siPhoneStep(); } });
      si.emailMasked = r.emailMasked;
      si.otpUntil = Date.now() + (r.seconds || OTP_SECONDS) * 1000;
      si.resendAt = Date.now() + 30000;
      siOtpStep();
    }).catch(handleError);
  }

  // ---- step 2a: sign-in PIN
  function siPinStep(errMsg) {
    var si = state.si, card = clear($('si-card'));
    var pin = digitBox('si-pin', 'PIN', 'current-password');
    var err = el('small', { class: 'err', style: 'display:block' }, errMsg || '');
    var go = el('button', { class: 'btn primary block', type: 'button', id: 'si-login' }, 'Log in');
    append(card, [
      siTitle('Welcome back ' + si.name, fmtPhone(si.phone)),
      pin.field, err, go,
      el('p', { class: 'si-foot' }, el('button', { class: 'link-btn', type: 'button', id: 'si-forgot2', onclick: startPinReset }, 'Forgot PIN?')),
      el('button', { class: 'btn ghost block', type: 'button', id: 'si-other', onclick: function () { showSignin(''); } }, 'Use another number')
    ]);
    function submit() {
      var v = pin.input.value;
      if (v.length !== PIN_LEN) { err.textContent = 'Please enter your ' + PIN_LEN + '-digit PIN.'; return; }
      call('signIn', si.phone, v).then(function (r) {
        if (!r.ok) { pin.input.value = ''; err.textContent = r.message; pin.input.focus(); return; }
        return signedIn(r, 'Sign in successfully', '');
      }).catch(handleError);
    }
    onEnter(pin.input, submit);
    go.addEventListener('click', submit);
    setTimeout(function () { pin.input.focus(); }, 50);
  }

  // ---- step 2b: code from the email (5 minutes, 5 tries)
  var otpTimer = null;
  function stopOtpTimer() { if (otpTimer) { clearInterval(otpTimer); otpTimer = null; } }

  function siOtpStep() {
    var si = state.si, card = clear($('si-card')), reset = si.mode === 'reset';
    var code = el('input', { id: 'si-otp', type: 'text', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '______', class: 'pin-in otp-in' });
    code.addEventListener('input', function () { code.value = code.value.replace(/\D/g, '').slice(0, 6); });
    var clock = el('span', { class: 'otp-clock', id: 'si-clock' });
    var err = el('small', { class: 'err', style: 'display:block' });
    var go = el('button', { class: 'btn primary block', type: 'button', id: 'si-verify' }, 'Verify');
    var resend = el('button', { class: 'btn ghost', type: 'button' }, 'Send a new code');
    var back = el('button', { class: 'btn ghost', type: 'button' }, 'Cancel');
    append(card, [
      siTitle(reset ? 'Reset your PIN' : 'Check your email',
        'We sent a 6-digit code to ' + si.emailMasked + (reset ? ', the email address on file for ' + fmtPhone(si.phone) + '.' : '.')),
      el('label', { class: 'field' }, el('span', null, 'Code from the email'), code, err),
      el('p', { class: 'otp-time' }, icon('timer'), 'Time left ', clock),
      go,
      el('div', { class: 'si-row' }, back, resend),
      el('p', { class: 'hint si-foot' }, 'Can\'t find it? Check your Spam / Junk folder.')
    ]);

    function tick() {
      var left = Math.max(0, Math.ceil((si.otpUntil - Date.now()) / 1000));
      clock.textContent = Math.floor(left / 60) + ':' + pad(left % 60);
      clock.classList.toggle('low', left <= 60);
      resend.disabled = Date.now() < si.resendAt;
      if (left === 0) {
        stopOtpTimer();
        callQuiet(reset ? 'cancelPinReset' : 'cancelRegistration', si.phone).catch(function () { /* ignore */ });
        modal('Time is up', reset ? 'The code was not entered within 5 minutes. Tap Forgot PIN? to get a new code.'
                                  : 'The code was not entered within 5 minutes, so the registration was cancelled. Please start again.')
          .then(function () { showSignin(si.phone); });
      }
    }
    function submit() {
      var v = code.value;
      if (v.length !== 6) { err.textContent = 'Please enter the 6-digit code.'; return; }
      call(reset ? 'verifyPinResetOtp' : 'verifyRegistrationOtp', si.phone, v).then(function (r) {
        if (r.ok) { stopOtpTimer(); return siSetPinStep(); }
        if (r.code === 'WRONG') { err.textContent = r.message; code.value = ''; code.focus(); return; }
        stopOtpTimer();
        return modal(reset ? 'Please try again' : 'Registration cancelled', r.message).then(function () { showSignin(si.phone); });
      }).catch(handleError);
    }
    onEnter(code, submit);
    go.addEventListener('click', submit);
    resend.addEventListener('click', function () { stopOtpTimer(); if (reset) startPinReset(); else startRegistration(); });
    back.addEventListener('click', function () {
      if (reset) {                                   // nothing to undo – just forget the code
        stopOtpTimer();
        callQuiet('cancelPinReset', si.phone).catch(function () { /* ignore */ });
        return showSignin(si.phone);
      }
      modal('Cancel registration?', 'Your registration will be cancelled.', [{ label: 'No', value: false }, { label: 'Yes', value: true, kind: 'danger' }])
        .then(function (yes) {
          if (!yes) return;
          stopOtpTimer();
          callQuiet('cancelRegistration', si.phone).catch(function () { /* ignore */ });
          showSignin(si.phone);
        });
    });
    stopOtpTimer();
    tick();
    otpTimer = setInterval(tick, 1000);
    setTimeout(function () { code.focus(); }, 50);
  }

  // ---- step 3: choose a PIN
  function siSetPinStep(errMsg) {
    var si = state.si, card = clear($('si-card')), reset = si.mode === 'reset';
    var a = digitBox('si-new', 'New PIN (' + PIN_LEN + ' digits)', 'new-password');
    var b = digitBox('si-new2', 'Confirm new PIN', 'new-password');
    var err = el('small', { class: 'err', style: 'display:block' }, errMsg || '');
    var go = el('button', { class: 'btn primary block', type: 'button', id: 'si-setpin' }, 'Set PIN');
    append(card, [
      reset ? siTitle('Set a new PIN', 'Email verified. Choose a new ' + PIN_LEN + '-digit PIN for ' + fmtPhone(si.phone) + '.')
            : siTitle('Set your PIN', 'Email verified. Choose a ' + PIN_LEN + '-digit PIN – you\'ll use it with your telephone number to sign in.'),
      a.field, b.field, err, go
    ]);
    function submit() {
      if (a.input.value.length !== PIN_LEN) { err.textContent = 'The PIN must be ' + PIN_LEN + ' digits.'; return; }
      if (a.input.value !== b.input.value) { err.textContent = 'The two PINs do not match.'; return; }
      call(reset ? 'setResetPin' : 'setNewPin', si.phone, a.input.value).then(function (r) {
        if (!r.ok) {
          if (r.code === 'EXPIRED') return modal('Please start again', r.message).then(function () { showSignin(si.phone); });
          err.textContent = r.message; return;
        }
        return signedIn(r, 'Sign in successfully', reset ? 'Your PIN has been changed.' : 'Your registration is complete.');
      }).catch(handleError);
    }
    onEnter(b.input, submit);
    go.addEventListener('click', submit);
    setTimeout(function () { a.input.focus(); }, 50);
  }

  /** Stores the session, loads the user's data, shows "Sign in successfully", then the menu. */
  function signedIn(r, title, text) {
    setSession(r.token, r.user);
    return loadInit().then(function () {
      return modal(title, text || ('Welcome, ' + r.user.name + '.'), [{ label: 'Ok', value: true, kind: 'primary' }]);
    }).then(function () { goMenu(); runPendingQr(); });
  }

  function setSession(token, user) {
    state.token = token; state.user = user;
    try { if (token) localStorage.setItem('kp_session', token); else localStorage.removeItem('kp_session'); } catch (e) { /* ignore */ }
    renderWho();
  }
  function renderWho() {
    var u = state.user;
    $('who').hidden = !u;
    if (!u) return;
    $('who-name').textContent = u.name;
    $('who-role').textContent = u.role;
    $('who-role').className = 'badge-admin role-' + String(u.role).toLowerCase();

  }
  function signOut() {
    modal('Sign out?', '', [{ label: 'No', value: false }, { label: 'Sign out', value: true, kind: 'danger' }]).then(function (yes) {
      if (!yes) return;
      var t = state.token;
      if (t) callQuiet('signOut', t).catch(function () { /* ignore */ });
      endSession();
      showSignin('');
    });
  }
  function endSession() {
    closeEdit();
    setSession(null, null);
    state.init = null;
    clearCalCache();
  }

  // ================================================================ PAGE A / B – MENU
  function renderMenu() {
    var grid = clear($('menu-grid')), u = state.user || {};
    var items = [
      { icon: 'event_available', title: 'Book a Session', sub: isStaff() ? 'Book for yourself or a customer' : 'Reserve a studio or trainer session', go: openBooking },

    }

    $('fab-wrap').hidden = !state.user;              // round QR-scan button – everyone (check-in)
    toggleFabMenu(false);

    items.forEach(function (it) {

        el('span', { class: 'menu-icon' }, icon(it.icon)),

    append(acc, [

      el('button', { class: 'btn out', type: 'button', id: 'm-out', onclick: signOut }, icon('logout'), 'Sign out')
    ]);

  }

  // ================================================================ CHANGE MY PIN (every role)
  /** Pop-up: current PIN, new PIN, new PIN again. `msg` = error shown when re-opened. */
  function openChangePin(msg) {
    var cur = digitBox('cp-cur', 'Current PIN', 'current-password'),
        nw = digitBox('cp-new', 'New PIN (' + PIN_LEN + ' digits)', 'new-password'),
        again = digitBox('cp-new2', 'Confirm new PIN', 'new-password');
    var body = el('div', null,
      msg ? el('p', { class: 'err', style: 'display:block;margin:0 0 10px' }, msg) : null,
      cur.field, nw.field, again.field);
    var p = modal('Change PIN', body, [{ label: 'Cancel', value: false }, { label: 'Save', value: true, kind: 'primary' }]);
    setTimeout(function () { cur.input.focus(); }, 50);
    p.then(function (yes) {
      if (!yes) return;
      var c = cur.input.value, n = nw.input.value, a = again.input.value;
      if (c.length !== PIN_LEN) return openChangePin('Please enter your current PIN.');
      if (n.length !== PIN_LEN) return openChangePin('The new PIN must be ' + PIN_LEN + ' digits.');
      if (n !== a) return openChangePin('The two new PINs do not match.');
      if (n === c) return openChangePin('The new PIN is the same as the current PIN.');
      return call('changeMyPin', state.token, c, n).then(function (r) {
        if (!r.ok) {
          if (r.code === 'LOCKED') return modal('Please wait', r.message);
          return openChangePin(r.message);
        }
        return modal('PIN changed', 'Your PIN has been changed. Use the new PIN next time you sign in.');
      });
    }).catch(handleError);
  }

  // ================================================================ BOOKING FORM (shared by Page C and the Edit pop-up)
  /**
   * Builds the booking form inside `root`.
   * opts.initial       – booking to pre-fill (edit mode)
   * opts.excludeKey    – booking key whose own hours must not block itself (edit mode)
   * opts.serviceStatus – show the Class Status field (not used since v3.3 – set by the rules)
   * opts.onChange      – called with true/false whenever the form becomes valid/invalid
   * Availability uses admin rules when an admin is signed in, customer rules otherwise.
   */
  function BookingForm(root, opts) {
    opts = opts || {};
    var init = state.init;
    var f = { service: '', viewYear: 0, viewMonth: 0, month: null, date: '', bookable: [], dead: false };
    var exKey = opts.excludeKey || null;
    var tok = auth();
    var lookedUp = '', autoName = '';
    // Customers always book for themselves – phone and name come from their account.
    var self = !isStaff() && !opts.initial;

    // ---- elements
    var phone = el('input', { id: 'bf-phone', type: 'tel', inputmode: 'numeric', autocomplete: 'off', maxlength: '12', placeholder: '081-234-5678' });
    var phoneErr = el('small', { class: 'err' });
    var name = el('input', { id: 'bf-name', type: 'text', autocomplete: 'off', maxlength: '100', placeholder: 'Customer name' });
    var nameHint = el('small', { class: 'hint' });
    var nameErr = el('small', { class: 'err' });
    var service = el('select');
    var picker = el('div', { class: 'picker is-disabled', 'aria-label': 'Booking date picker' });
    var dateLabel = el('p', { class: 'selected-date' });
    var start = el('select', { disabled: true });
    var end = el('select', { disabled: true });
    var sstatus = opts.serviceStatus ? el('select') : null;
    var summary = el('p', { class: 'summary' });
    // Price adjustment (admin edit): Discount / Increase + positive amount
    var adjType = null, adjAmt = null, adjErr = null, priceInfo = null;
    if (opts.priceAdjust) {
      adjType = el('select', { class: 'adj-type', 'aria-label': 'Discount or increase' });
      fillSelect(adjType, [{ value: 'discount', label: 'Discount (−)' }, { value: 'increase', label: 'Increase (+)' }], null);
      adjAmt = el('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', maxlength: '12', placeholder: '0', class: 'adj-amt', 'aria-label': 'Adjustment amount (฿)' });
      adjErr = el('small', { class: 'err' });
      priceInfo = el('p', { class: 'price-info' });
    }

    // trainer/admin: suggestions of registered users while typing a phone number or a name
    var sugPhone = el('ul', { class: 'suggest', role: 'listbox', hidden: true });
    var sugName = el('ul', { class: 'suggest', role: 'listbox', hidden: true });
    clear(root);
    append(root, [
      el('div', { class: 'field sug-field' }, el('label', { class: 'lbl', for: 'bf-phone' }, 'Telephone Number'), phone, sugPhone, phoneErr),
      el('div', { class: 'field sug-field' }, el('label', { class: 'lbl', for: 'bf-name' }, 'Customer Name'), name, sugName, nameHint, nameErr),
      el('label', { class: 'field' }, el('span', null, 'Service Program'), service),
      el('div', { class: 'field' }, el('span', null, 'Booking Date'), picker,
        el('div', { class: 'legend' },
          el('span', null, el('i', { class: 'dot dot-ok' }), 'Available'),
          el('span', null, el('i', { class: 'dot dot-full' }), 'Fully booked'),
          el('span', null, el('i', { class: 'dot dot-grey' }), 'Past / closed')),
        dateLabel),
      el('div', { class: 'row-2' },
        el('label', { class: 'field' }, el('span', null, 'Start Time'), start),
        el('label', { class: 'field' }, el('span', null, 'End Time'), end)),
      sstatus ? el('label', { class: 'field' }, el('span', null, 'Class Status'), sstatus) : null,
      adjType ? el('div', { class: 'field' }, el('span', null, 'Price Adjustment'),
        el('div', { class: 'adj-row' }, adjType, el('div', { class: 'adj-amt-wrap' }, el('span', { class: 'adj-cur' }, '฿'), adjAmt)),
        el('small', { class: 'hint' }, 'Enter the amount only – a discount is saved as a negative number, an increase as a positive one.'),
        adjErr, priceInfo) : null,
      summary
    ]);
    fillSelect(service, init.services.map(function (s) { return { value: s.idName, label: s.idName }; }), 'Select a program…');
    // trainer/admin: clear (x) buttons on the phone and name boxes (customers' own details are locked)
    // pressing x in either box clears both the phone number and the name
    var clearBoth = function () {
      [phone, name].forEach(function (inp) {
        if (!inp.value) return;
        inp.value = '';
        inp.dispatchEvent(new Event('input', { bubbles: true }));
      });
      lookedUp = ''; autoName = '';
      phoneErr.textContent = ''; nameErr.textContent = ''; nameHint.textContent = '';
      hideSuggest();
      changed();
    };
    var clrPhone = self ? null : addClearX(phone, clearBoth), clrName = self ? null : addClearX(name, clearBoth);
    fillSelect(start, [], 'Select start time');
    fillSelect(end, [], 'Select end time');
    if (sstatus) fillSelect(sstatus, (init.classStatuses || []).map(function (s) { return { value: s, label: s }; }), null);
    if (self) {
      phone.value = fmtPhone(state.user.phone); phone.readOnly = true; phone.classList.add('ro-in');
      name.value = state.user.name; name.readOnly = true; name.classList.add('ro-in');
      nameHint.textContent = 'Booking for your own account.';
    }

    // ---- events
    phone.addEventListener('input', function () {
      if (self) return;
      formatPhoneInput(phone);
      phoneErr.textContent = '';
      var d = phoneDigits(phone.value);
      if (d.length === 10 && d !== lookedUp) lookupPhone(d);
      if (d.length < 10) { lookedUp = ''; nameHint.textContent = ''; }
      changed();
    });
    phone.addEventListener('blur', function () {
      var d = phoneDigits(phone.value);
      phoneErr.textContent = d && d.length !== 10 ? 'Please enter a 10-digit telephone number (xxx-xxx-xxxx).' : '';
    });
    name.addEventListener('input', function () { updateNameHint(); changed(); suggest('name'); });
    phone.addEventListener('input', function () { suggest('phone'); });
    [phone, name].forEach(function (inp) {
      inp.addEventListener('blur', function () {
        setTimeout(function () { if (document.activeElement !== phone && document.activeElement !== name) hideSuggest(); }, 120);
      });
      inp.addEventListener('keydown', function (e) {
        var ul = inp === phone ? sugPhone : sugName;
        if (ul.hidden) return;
        var items = ul.querySelectorAll('li'), cur = ul.querySelector('li.on'), i = Array.prototype.indexOf.call(items, cur);
        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          i = e.key === 'ArrowDown' ? Math.min(items.length - 1, i + 1) : Math.max(0, i - 1);
          items.forEach(function (li, k) { li.classList.toggle('on', k === i); });
        } else if (e.key === 'Enter' && cur) { e.preventDefault(); cur.dispatchEvent(new Event('mousedown')); }
        else if (e.key === 'Escape') hideSuggest();
      });
    });

    /** Shows up to 8 users whose phone (digits) or name contains what was typed. */
    function suggest(which) {
      var people = (state.init && state.init.people) || [];
      if (self || !people.length) return;
      var ul = which === 'phone' ? sugPhone : sugName, other = which === 'phone' ? sugName : sugPhone;
      other.hidden = true;
      var q = which === 'phone' ? phoneDigits(phone.value) : name.value.trim().toLowerCase();
      if ((which === 'phone' && q.length < 3) || (which === 'name' && q.length < 2)) { ul.hidden = true; return; }
      var hits = people.filter(function (p) {
        return which === 'phone' ? p.phone.indexOf(q) !== -1 : p.name.toLowerCase().indexOf(q) !== -1;
      });
      // exact match already filled in → nothing to suggest
      if (hits.length === 1 && hits[0].phone === phoneDigits(phone.value) && hits[0].name === name.value.trim()) hits = [];
      clear(ul);
      hits.slice(0, 8).forEach(function (p) {
        ul.appendChild(el('li', { role: 'option', onmousedown: function (e) { e.preventDefault(); pickPerson(p); } },
          el('strong', null, p.name), el('span', null, fmtPhone(p.phone) + (p.id ? ' · ' + p.id : ''))));
      });
      ul.hidden = !hits.length;
    }
    function hideSuggest() { sugPhone.hidden = true; sugName.hidden = true; }
    /** Picked a user → fill in both phone number and name. */
    function pickPerson(p) {
      phone.value = fmtPhone(p.phone);
      name.value = p.name;
      lookedUp = p.phone; autoName = p.name;
      phoneErr.textContent = ''; nameErr.textContent = '';
      hideSuggest();
      updateNameHint(true);
      changed();
    }
    name.addEventListener('blur', function () { nameErr.textContent = name.value.trim() ? '' : 'Please enter the customer name.'; });
    service.addEventListener('change', function () {
      f.service = service.value;
      resetFrom('service');
      if (f.service) loadMonth();
    });
    start.addEventListener('change', onStart);
    end.addEventListener('change', changed);
    if (sstatus) sstatus.addEventListener('change', changed);
    if (adjType) {
      adjType.addEventListener('change', changed);
      adjAmt.addEventListener('input', function () {
        var v = adjAmt.value.replace(/[^\d.]/g, '');
        var dot = v.indexOf('.');
        if (dot !== -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, '').slice(0, 2);
        if (v !== adjAmt.value) adjAmt.value = v;
        changed();
      });
    }

    // ---- view month = today's month (or the edited booking's month if later)
    var first = (opts.initial && opts.initial.date > init.today) ? opts.initial.date : init.today;
    var t = keyToUTC(first);
    f.viewYear = t.getUTCFullYear(); f.viewMonth = t.getUTCMonth() + 1;
    renderPicker();
    changed();

    /** Phone typed → look it up in M_Customer and fill in the name. */
    function lookupPhone(d) {
      if (d === lookedUp) return;
      lookedUp = d;
      nameHint.textContent = 'Checking customer list…';
      callQuiet('lookupCustomer', d, tok).then(function (r) {
        if (f.dead || phoneDigits(phone.value) !== d || !r || !r.ok) return;
        if (r.found) {
          name.value = r.name;
          autoName = r.name;
          nameErr.textContent = '';
        } else {
          if (autoName && name.value.trim() === autoName) name.value = '';
          autoName = '';
        }
        updateNameHint(r.found);
        changed();
      }).catch(function () { nameHint.textContent = ''; });
    }
    function updateNameHint(found) {
      if (self) return;
      if (phoneDigits(phone.value).length !== 10 || !lookedUp) { if (!opts.initial) nameHint.textContent = ''; return; }
      if (autoName) {
        nameHint.textContent = name.value.trim() && name.value.trim() !== autoName
          ? 'This name is different from the user list – the list will be updated when you confirm.'
          : 'Registered user – the name has been filled in.';
      } else if (found === false || !autoName) {
        nameHint.textContent = 'New customer – please enter the name. They will be added to the user list.';
      }
    }

    function resetFrom(level) {
      if (level === 'service') { f.date = ''; f.month = null; renderPicker(); }
      if (level === 'service' || level === 'date') {
        f.bookable = [];
        fillSelect(start, [], 'Select start time'); start.disabled = true;
        dateLabel.textContent = f.date ? fmtDateLong(f.date) : '';
      }
      fillSelect(end, [], 'Select end time'); end.disabled = true;
      changed();
    }

    function loadMonth() {
      var svc = f.service;
      if (!svc) { renderPicker(); return Promise.resolve(); }
      f.month = null; renderPicker();
      return call('getMonthAvailability', svc, f.viewYear, f.viewMonth, exKey, tok).then(function (r) {
        if (f.dead || svc !== f.service) return;
        if (!r.ok) return modal('Please check', r.message);
        f.month = r;
        renderPicker();
      }).catch(handleError);
    }

    function changeMonth(delta) {
      var m = f.viewMonth + delta, y = f.viewYear;
      if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
      f.viewYear = y; f.viewMonth = m;
      loadMonth();
    }

    function renderPicker() {
      clear(picker);
      var enabled = !!f.service;
      picker.classList.toggle('is-disabled', !enabled);

      var monthKey = f.viewYear + '-' + pad(f.viewMonth);
      var todayM = init.today.slice(0, 7);
      var minM = init.calMin ? init.calMin.slice(0, 7) : todayM;
      var maxM = init.calMax ? init.calMax.slice(0, 7) : null;
      var low = minM > todayM ? minM : todayM;
      var canPrev = enabled && monthKey > low;
      var canNext = enabled && (!maxM || monthKey < maxM);

      picker.appendChild(el('div', { class: 'picker-head' },
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Previous month', disabled: !canPrev, onclick: function () { changeMonth(-1); } }, icon('chevron_left')),
        el('strong', null, MONTHS_FULL[f.viewMonth - 1] + ' ' + f.viewYear),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Next month', disabled: !canNext, onclick: function () { changeMonth(1); } }, icon('chevron_right'))));

      var grid = el('div', { class: 'picker-grid', role: 'grid' });
      DOW_MON.forEach(function (d) { grid.appendChild(el('div', { class: 'picker-dow' }, d)); });
      var firstDay = monthKey + '-01';
      var lead = (dow(firstDay) + 6) % 7;
      for (var i = 0; i < lead; i++) grid.appendChild(el('div', { class: 'day blank' }));

      var nDays = +lastOfMonth(firstDay).slice(8, 10);
      for (var d = 1; d <= nDays; d++) {
        (function (key) {
          var info = f.month && f.month.days ? f.month.days[key] : null;
          var st = !enabled || !f.month ? 'off' : (info ? info.state : (key < init.today ? 'past' : 'none'));
          var cls = 'day ' + (st === 'ok' ? 'd-ok' : st === 'full' ? 'd-full' : 'd-grey');
          if (key === init.today) cls += ' is-today';
          if (key === f.date) cls += ' is-selected';
          var label = fmtDateLong(key) + (st === 'full' ? ' – fully booked' : st === 'ok' ? ' – available' : ' – unavailable');
          grid.appendChild(el('button', {
            class: cls, type: 'button', disabled: st !== 'ok', 'aria-label': label, title: st === 'full' ? 'Fully booked' : null,
            onclick: function () { selectDate(key); }
          }, String(+key.slice(8, 10))));
        })(monthKey + '-' + pad(d));
      }
      picker.appendChild(grid);
    }

    /** Loads the time slots of a date. Resolves true when start times are available. */
    function selectDate(key, quiet) {
      var svc = f.service;
      f.date = key;
      resetFrom('date');
      renderPicker();
      // The month data already holds every day's free hours → no extra server
      // round trip. (The server checks again when the booking is confirmed.)
      var cached = f.month && f.month.days && f.month.days[key];
      var req = cached
        ? Promise.resolve({ ok: true, state: cached.state, bookable: cached.bookable.slice() })
        : call('getDaySlots', svc, key, exKey, tok);
      return req.then(function (r) {
        if (f.dead || svc !== f.service || key !== f.date) return false;
        if (!r.ok) { modal('Please check', r.message); return false; }
        var list = r.bookable.slice();
        // Edit mode: the booking's own hours stay selectable on its own date
        // (also when they are in the past, so status/name can still be corrected).
        var ini = opts.initial;
        if (ini && key === ini.date && svc === ini.service) {
          for (var i = ini.startIdx; i <= ini.endIdx; i++) if (list.indexOf(i) === -1) list.push(i);
          list.sort(function (a, b) { return a - b; });
        }
        if (f.month && f.month.days) f.month.days[key] = { state: list.length ? 'ok' : r.state, bookable: list };
        if (!list.length) {
          if (!quiet) toast('No times left on this date. Please choose another day.');
          f.date = ''; resetFrom('date'); renderPicker();
          return false;
        }
        f.bookable = list;
        fillSelect(start, list.map(function (i) { return { value: i, label: idxStart(i) }; }), 'Select start time');
        start.disabled = false;
        changed();
        return true;
      }).catch(function (e) { handleError(e); return false; });
    }

    /** End time options: every consecutive bookable hour from the start; stops at the first gap. */
    function onStart() {
      var s = +start.value;
      fillSelect(end, [], 'Select end time'); end.disabled = true;
      if (s) {
        var ok = {}; f.bookable.forEach(function (i) { ok[i] = true; });
        var opts2 = [];
        for (var i = s; i <= 24 && ok[i]; i++) {
          var h = i - s + 1;
          opts2.push({ value: i, label: idxEnd(i) + '  (' + h + (h === 1 ? ' hr)' : ' hrs)') });
        }
        fillSelect(end, opts2, 'Select end time');
        end.disabled = false;
        if (opts2.length === 1) end.value = String(opts2[0].value);
      }
      changed();
    }

    function payload() {
      var p = {
        phone: phoneDigits(phone.value), name: name.value.trim(),
        service: f.service, date: f.date,
        startIdx: +start.value, endIdx: +end.value
      };
      if (sstatus) p.serviceStatus = sstatus.value;
      var ok = /^\d{10}$/.test(p.phone) && p.name && p.service && p.date && p.startIdx && p.endIdx && p.endIdx >= p.startIdx;
      if (adjType) {
        var pr = priceCheck(p);
        if (!pr.ok) ok = false;
        p.adjustType = adjType.value;
        p.adjustAmount = adjAmt.value.trim() || '0';
        p.adjust = pr.adjust;        // signed amount (for the confirmation pop-up)
        p.rate = pr.rate;
      }
      return ok ? p : null;
    }

    /** Rate stays as booked unless the service changes; discount can't exceed the price. */
    function priceCheck(p) {
      var ini = opts.initial || {};
      var svc = init.services.filter(function (s) { return s.idName === p.service; })[0];
      var rate = (p.service === ini.service) ? (ini.rate || 0) : (svc ? svc.rate || 0 : 0);
      var hours = p.startIdx && p.endIdx && p.endIdx >= p.startIdx ? p.endIdx - p.startIdx + 1 : 0;
      var txt = adjAmt.value.trim();
      var valid = txt === '' || /^\d+(\.\d{1,2})?$/.test(txt);
      var amt = valid ? Number(txt || 0) : 0;
      var adjust = amt === 0 ? 0 : (adjType.value === 'discount' ? -amt : amt);
      var base = rate * hours;
      var msg = !valid ? 'Please enter a positive amount, e.g. 200.'
        : (hours && -adjust > base) ? 'The discount can\'t be more than the booking price (' + fmtMoney(base) + ').' : '';
      return { ok: !msg, msg: msg, rate: rate, hours: hours, base: base, adjust: adjust };
    }

    function changed() {
      if (clrPhone) clrPhone.sync();
      if (clrName) clrName.sync();
      var p = payload();
      summary.textContent = p
        ? fmtDate(p.date) + ' · ' + idxStart(p.startIdx) + '–' + idxEnd(p.endIdx) + ' · ' + (p.endIdx - p.startIdx + 1) + ' hr'
        : '';
      if (adjType) {
        var raw = { service: f.service, startIdx: +start.value, endIdx: +end.value };
        var pr = priceCheck(raw);
        adjErr.textContent = pr.msg;
        priceInfo.textContent = pr.hours
          ? pr.hours + ' hr × ' + fmtMoney(pr.rate) + ' = ' + fmtMoney(pr.base) +
            (pr.adjust ? '  ' + fmtAdj(pr.adjust) : '') + '  →  Total ' + fmtMoney(pr.base + pr.adjust)
          : '';
      }
      if (opts.onChange) opts.onChange(!!p);
    }

    // ---- edit mode: pre-fill everything, then select the booking's own date and times
    if (opts.initial) {
      var b = opts.initial;
      phone.value = fmtPhone(b.phone);
      lookedUp = phoneDigits(b.phone);            // no look-up for the original number
      autoName = b.name;
      name.value = b.name;
      if (sstatus) sstatus.value = b.classStatus && (init.classStatuses || []).indexOf(b.classStatus) !== -1 ? b.classStatus : 'Scheduled';
      if (adjType) {
        var a0 = Number(b.adjust) || 0;
        adjType.value = a0 > 0 ? 'increase' : 'discount';
        adjAmt.value = a0 ? String(Math.abs(a0)) : '';
      }
      var known = init.services.some(function (s) { return s.idName === b.service; });
      if (known) {
        service.value = b.service; f.service = b.service;
        loadMonth().then(function () { return selectDate(b.date, true); }).then(function (ok) {
          if (!ok || f.dead) return;
          start.value = String(b.startIdx);
          if (start.value === String(b.startIdx)) {
            onStart();
            end.value = String(b.endIdx);
            if (end.value !== String(b.endIdx)) end.value = '';
          }
          changed();
        });
      }
      changed();
    }

    return {
      payload: payload,
      isDirty: function () { return self ? !!f.service : !!(phone.value || name.value.trim() || f.service); },
      reload: function () { var k = f.date; loadMonth(); if (k) selectDate(k); },
      destroy: function () { f.dead = true; }
    };
  }

  // ================================================================ PAGE C – BOOKING
  function openBooking() {
    if (state.bookForm) state.bookForm.destroy();
    $('bk-confirm').disabled = true;
    state.bookForm = BookingForm($('bk-form'), { onChange: function (ok) { $('bk-confirm').disabled = !ok; } });
    show('book');

  function backFromBooking() {
    if (!state.bookForm || !state.bookForm.isDirty()) return goMenu();
    modal('Discard this booking?', 'The details you entered will be lost.',
      [{ label: 'Keep editing', value: false }, { label: 'Discard', value: true, kind: 'danger' }])
      .then(function (yes) { if (yes) goMenu(); });
  }

  function confirmBooking() {
    var p = state.bookForm && state.bookForm.payload();
    if (!p) return;
    var hours = p.endIdx - p.startIdx + 1;
    var body = kv([
      ['Name', p.name], ['Telephone', fmtPhone(p.phone)], ['Service', p.service],

        });
      }).catch(handleError);
  }

  // ================================================================ BOOKING CREATED + PIN PICTURE
  var PIN_NOTE = 'Please keep this PIN for booking cancellation. It will not be shown again.';
  var PIN_QR_NOTE = 'Keep the PIN to cancel – it won\'t be shown again. At the studio, scan the Class QR (or show this QR) to check in.';

  /** "The booking has been created" pop-up with the Booking PIN and one button: Save PIN as picture. */
  function showCreated(bk) {
    if (!bk.pin) {
      return modal('The booking has been confirmed', bookingKv(bk), [{ label: 'Ok', value: true, kind: 'primary' }]).then(goMenu);
    }
    // compact: PIN on the left, QR on the right, one note underneath – fits without scrolling
    var pinBox = el('div', { class: 'pin-box' },
      el('div', { class: 'pin-label' }, 'Booking PIN'),
      el('div', { class: 'pin-code', 'aria-label': 'Booking PIN ' + bk.pin.split('').join(' ') }, bk.pin),
      el('div', { class: 'pin-sub' }, 'for cancellation'));
    var body = el('div', null, bookingKv(bk),
      el('div', { class: 'codes' + (bk.qrUrl ? '' : ' no-qr') }, pinBox,
        bk.qrUrl ? qrBlock(bk.qrUrl, 'Scan at the studio', 116) : null),
      el('p', { class: 'pin-note codes-note' }, bk.qrUrl ? PIN_QR_NOTE : PIN_NOTE));
    return modal('The booking has been confirmed', body, [{ label: 'Save PIN and QR as picture', value: 'save', kind: 'primary' }])
      .then(function (v) {
        if (v !== 'save') return showCreated(bk);        // closed another way (e.g. Esc) → show it again, never lose the PIN
        var pic = drawPinPicture(bk);                    // runs inside the tap, so phones allow the share menu
        return deliverPicture(pic).then(function (how) { return showPicture(pic, how); });
      });
  }
  function bookingKv(bk) {
    var rows = [['Date', fmtDateLong(bk.date)], ['Time', bk.start + ' – ' + bk.end], ['Service', bk.service], ['Name', bk.name]];
    if (bk.bookingId) rows.unshift(['Booking ID', bk.bookingId]);
    return kv(rows);
  }

  /** Draws the notification (without buttons) on a canvas → { dataUrl, blob, name }. */
  function drawPinPicture(bk) {
    var S = 2, W = 360, pad = 24;                        // logical size; drawn at 2× for a sharp picture
    var font = function (w, px) { return w + ' ' + px + 'px "DM Sans", -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif'; };
    var c = document.createElement('canvas'), g = c.getContext('2d');
    // measure text wrapping first so the height fits the content
    g.font = font(400, 13.5);
    var wrap = function (text, maxW) {
      var words = String(text).split(' '), lines = [], line = '';
      words.forEach(function (w) { var t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; });
      if (line) lines.push(line); return lines;
    };
    var rows = [['Date', fmtDateLong(bk.date)], ['Time', bk.start + ' – ' + bk.end], ['Service', bk.service], ['Name', bk.name]];
    if (bk.bookingId) rows.unshift(['Booking ID', bk.bookingId]);
    // booking QR code (same one as in the pop-up) – drawn module by module so it stays sharp
    var qr = null;
    if (bk.qrUrl && window.qrcode) { try { qr = window.qrcode(0, 'M'); qr.addData(bk.qrUrl); qr.make(); } catch (e) { qr = null; } }
    g.font = font(600, 15);
    var rowLines = rows.map(function (r) { return wrap(r[1], W - pad * 2 - 90); });
    g.font = font(400, 13.5);
    var noteLines = wrap(PIN_NOTE, W - pad * 2 - 32);
    if (qr) noteLines = wrap(PIN_QR_NOTE, W - pad * 2 - 8);
    var QR_SIZE = 124, BOX_H = 150;               // PIN box (left) and QR (right) side by side
    var H = 26 + 34 + 26 + rowLines.reduce(function (n, l) { return n + l.length * 21 + 8; }, 0) + 10 + BOX_H + 12 + noteLines.length * 19 + 30;
    c.width = W * S; c.height = H * S; g.scale(S, S);

    var round = function (x, y, w, h, r, fill, stroke) {
      g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
      g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
      if (fill) { g.fillStyle = fill; g.fill(); } if (stroke) { g.strokeStyle = stroke; g.lineWidth = 1; g.stroke(); }
    };
    g.fillStyle = '#F5F1EB'; g.fillRect(0, 0, W, H);
    round(8, 8, W - 16, H - 16, 18, '#FFFFFF', '#E6DFD5');
    var y = 26 + 8;
    g.textBaseline = 'top';
    g.fillStyle = '#5E8C7A'; g.font = font(700, 12); g.fillText('KERYX PILATES', pad, y); y += 20;
    // title: largest size (max 20px) that fits on one line with the same space left and right
    var TITLE = 'The booking has been confirmed', tSize = 20;
    g.font = font(700, tSize);
    while (tSize > 14 && g.measureText(TITLE).width > W - pad * 2 - 4) { tSize -= 0.5; g.font = font(700, tSize); }
    g.fillStyle = '#2D2A26'; g.fillText(TITLE, pad, y + (20 - tSize) / 2); y += 40;
    rows.forEach(function (r, i) {
      g.fillStyle = '#7A736A'; g.font = font(400, 15); g.fillText(r[0], pad, y);
      g.fillStyle = '#2D2A26'; g.font = font(600, 15);
      rowLines[i].forEach(function (l, j) { g.fillText(l, pad + 90, y + j * 21); });
      y += rowLines[i].length * 21 + 8;
    });
    y += 10;
    var boxW = qr ? (W - pad * 2 - 12) / 2 : W - pad * 2;      // PIN box and QR card: same width
    // PIN box
    round(pad, y, boxW, BOX_H, 14, '#FFF6DA', '#F1D6A6');
    g.textAlign = 'center';
    var cx = pad + boxW / 2;
    // "BOOKING PIN" and "for cancellation" stay where they were; the digits are placed exactly
    // halfway between them (measured on the real ink of the letters, so it works with any font)
    var pSize = qr ? 30 : 40, gap = qr ? 22 : 30;
    var labelY = y + 22, subY = y + 106;                     // top of the two small texts (unchanged)
    g.textBaseline = 'top';
    var ink = function (txt) { var m = g.measureText(txt); return { up: m.actualBoundingBoxAscent || 0, down: m.actualBoundingBoxDescent || 0 }; };
    g.font = font(700, 12); var L = ink('BOOKING PIN');
    g.font = font(400, 12.5); var C = ink('for cancellation');
    g.font = font(800, pSize); var D = ink('0123456789');
    var mid = ((labelY + L.down) + (subY - C.up)) / 2;      // halfway between label bottom and "for cancellation" top
    var digitY = mid - (D.down - D.up) / 2;
    g.fillStyle = '#8A5300'; g.font = font(700, 12); g.fillText('BOOKING PIN', cx, labelY);
    g.fillStyle = '#2D2A26'; g.font = font(800, pSize);
    var digits = bk.pin.split(''), x0 = cx - gap * (digits.length - 1) / 2;
    digits.forEach(function (d, i) { g.fillText(d, x0 + i * gap, digitY); });
    g.fillStyle = '#6B4A12'; g.font = font(400, 12.5); g.fillText('for cancellation', cx, subY);
    // QR (white card on the right)
    if (qr) {
      var qx0 = W - pad - boxW;
      round(qx0, y, boxW, BOX_H, 14, '#FFFFFF', '#E6DFD5');
      var n = qr.getModuleCount(), cell = Math.max(1, Math.floor(QR_SIZE / (n + 2))), size = cell * (n + 2);
      var qx = Math.round(qx0 + (boxW - size) / 2), qy = Math.round(y + 6 + (QR_SIZE - size) / 2);
      g.fillStyle = '#000000';
      for (var r = 0; r < n; r++) for (var cc = 0; cc < n; cc++) if (qr.isDark(r, cc)) g.fillRect(qx + (cc + 1) * cell, qy + (r + 1) * cell, cell, cell);
      g.fillStyle = '#7A736A'; g.font = font(600, 11.5); g.fillText('Scan at the studio', qx0 + boxW / 2, y + BOX_H - 18);
    }
    y += BOX_H + 12;
    // note under both
    g.fillStyle = '#6B4A12'; g.font = font(400, 13.5);
    noteLines.forEach(function (l, i) { g.fillText(l, W / 2, y + i * 19); });
    g.textAlign = 'left';

    var dataUrl = c.toDataURL('image/png');
    var bin = atob(dataUrl.split(',')[1]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return { dataUrl: dataUrl, blob: new Blob([arr], { type: 'image/png' }), name: 'Keryx-Booking-' + (bk.bookingId ? bk.bookingId + '-' : '') + bk.date + '-' + bk.start.replace(':', '') + '.png' };
  }

  /**
   * Phones: share menu (→ "Save Image" puts it in Photos). PC: download.
   * Resolves 'shared' | 'downloaded' | 'failed'.
   */
  function deliverPicture(pic) {
    var download = function () {
      try {
        var url = URL.createObjectURL(pic.blob), a = el('a', { href: url, download: pic.name });
        document.body.appendChild(a); a.click();
        setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 4000);
        return 'downloaded';
      } catch (e) { return 'failed'; }
    };
    // iPhone/iPad can't download a picture into Photos – the share sheet's "Save Image" does it in one tap.
    // PC and Android download the picture straight away (Downloads folder / Gallery).
    var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
    var file = null;
    try { file = new File([pic.blob], pic.name, { type: 'image/png' }); } catch (e) { file = null; }
    if (ios && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      return navigator.share({ files: [file], title: 'Keryx Pilates – Booking PIN' })
        .then(function () { return 'shared'; })
        .catch(function (e) { return e && e.name === 'AbortError' ? 'failed' : download(); });
    }
    return Promise.resolve(download());
  }

  /** Shows the saved picture, so it can be saved again by hand if the device blocked it. */
  function showPicture(pic, how) {
    var tip = how === 'downloaded' ? 'Saved to Downloads. ' : how === 'shared' ? '' : 'Not saved automatically. ';
    tip += 'To save it again, press and hold the picture (phone) or right-click it (PC).';
    var body = el('div', { class: 'pic-body' },
      el('img', { src: pic.dataUrl, alt: 'Booking PIN and QR picture', class: 'pin-pic' }),
      el('p', { class: 'hint pic-tip' }, tip));
    var p = modal('Booking picture', body, [{ label: 'Done', value: true, kind: 'primary' }]);
    $('modal-root').classList.add('pic-modal');
    return p.then(function () { $('modal-root').classList.remove('pic-modal'); goMenu(); });
  }

  // ================================================================ PAGE D – CANCELLATION

  /** Text filter: any part of the name, service, trainer or Customer ID, or digits of the phone number. */
  function matchesText(b) {

    if (hay.indexOf(q) !== -1) return true;

  /** Same rule as the server: Booked (not checked in) and not started. */

  function visibleCancelItems() {

  function selectedKeys() { return Object.keys(state.cancel.selected).filter(function (k) { return state.cancel.selected[k]; }); }

            onchange: function (e) { c.selected[b.key] = e.target.checked; renderCancelList(); }
          }),

            el('div', { class: 'bk-svc' }, b.service),

              onclick: function (e) { e.preventDefault(); e.stopPropagation(); openBookingQr(b); } }, icon('qr_code_2'), 'QR') : null),
          // check-in on the day of the class (button works from 1 hour before the start until the end)
          b.checkIn ? el('div', { class: 'bk-checkin' },

  /**
   * Customers confirm with the Booking PIN of every selected booking;
   * admin and trainer cancel without a PIN.
   * `msg` = error shown when the pop-up is re-opened.
   */
  function cancelSelected(msg) {
    var keys = selectedKeys();
    if (!keys.length) return;
    var chosen = state.cancel.items.filter(function (b) { return state.cancel.selected[b.key]; });
    var needPin = !isStaff();
    var pinInputs = {};
    var line = function (b) { return b.name + ' · ' + fmtDate(b.date) + ' · ' + b.start + '–' + b.end + ' · ' + b.service; };
    var body = el('div', null,
      typeof msg === 'string' && msg ? el('p', { class: 'err', style: 'display:block;margin:0 0 10px' }, msg) : null,
      el('p', null, 'Cancel the following ' + chosen.length + (chosen.length === 1 ? ' booking?' : ' bookings?')),
      needPin
        ? el('div', null,
            el('p', { class: 'hint', style: 'margin:0 0 10px' }, 'Enter the 6-digit Booking PIN you received when you booked.'),
            chosen.map(function (b) {
              var inp = el('input', { type: 'password', inputmode: 'numeric', autocomplete: 'one-time-code', maxlength: '6', placeholder: '••••••', class: 'pin-in' });
              inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, '').slice(0, 6); });

              return el('label', { class: 'field' }, el('span', { class: 'pin-for' }, line(b)), inp);
            }))
        : el('ul', { class: 'mini-list' }, chosen.map(function (b) { return el('li', null, line(b)); })));
    modal('Confirm cancellation', body, [{ label: 'No', value: false }, { label: 'Yes', value: true, kind: 'danger' }])
      .then(function (yes) {
        if (!yes) return;
        var pins = null;
        if (needPin) {
          pins = {};
          var missing = keys.some(function (k) { pins[k] = pinInputs[k] ? pinInputs[k].value : ''; return !/^\d{6}$/.test(pins[k]); });
          if (missing) return cancelSelected('Please enter the 6-digit Booking PIN for each booking.');

  function loadScript(url) {
    if (!libs[url]) {
      libs[url] = new Promise(function (resolve, reject) {
        var sc = document.createElement('script');
        sc.src = url; sc.async = true;
        sc.onload = function () { resolve(); };
        sc.onerror = function () { delete libs[url]; reject(new Error('Could not load ' + url.split('/').pop() + ' – please check the internet connection.')); };
        document.head.appendChild(sc);

  }

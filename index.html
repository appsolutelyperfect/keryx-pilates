  function hasLiveScanner() { var i = state.init || {}; return !!(i.scannerUrl && i.appUrl); }
  function toggleFabMenu(open) {     // the small Camera / Photo buttons were removed – kept so old calls still work
    if (!$('fab-menu')) return;
    var w = $('fab-wrap');
    open = open === undefined ? !w.classList.contains('open') : !!open;
    w.classList.toggle('open', open);
    $('scan-fab').setAttribute('aria-expanded', open ? 'true' : 'false');
    $('fab-menu').setAttribute('aria-hidden', open ? 'false' : 'true');
    $('scan-fab').querySelector('.ms').textContent = open ? 'close' : 'qr_code_scanner';
  }
  function onScanFab() {
    if (liveCameraBlocked()) { $('fab-file').click(); return; }
    openScan();
  }
  function liveCameraBlocked() {
    try { if (localStorage.getItem('kp_cam') === 'photo') return true; } catch (e) { /* ignore */ }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return true;
    var pp = document.permissionsPolicy || document.featurePolicy;
    if (pp && pp.allowsFeature) { try { return !pp.allowsFeature('camera'); } catch (e) { /* ignore */ } }
    try { if (window.top !== window) void window.top.location.href; } catch (e) { return true; }   // inside another site's frame
    return false;
  }
  function rememberPhotoMode() { try { localStorage.setItem('kp_cam', 'photo'); } catch (e) { /* ignore */ } }

  /** Scan page in "photo" state (used after the phone's camera app returns a picture). */
  function prepScanPage() {
    stopCamera();
    clear($('sc-result')); $('sc-result').hidden = true;
    $('sc-again').hidden = true; $('sc-upload').hidden = true;
    $('sc-scan').hidden = false;
    $('sc-view').hidden = true;
    $('sc-photo-btn').hidden = false;
    $('sc-photo-btn').classList.remove('ghost-alt');
    scan.busy = false;
  }

  function openScan(directToken) {
    show('scan');
    clear($('sc-result')); $('sc-result').hidden = true;
    if (!directToken && liveCameraBlocked()) { prepScanPage(); setScanMsg('Take a photo of the QR code.'); return; }
    $('sc-again').hidden = true; $('sc-upload').hidden = true;
    $('sc-scan').hidden = false;
    if (directToken) { $('sc-scan').hidden = true; return showBookingCheckIn(directToken); }
    startCamera();
  }

  /** Live camera when allowed; otherwise (e.g. blocked inside the app frame) the photo fallback. */
  function startCamera() {
    stopCamera();
    scan.busy = false;
    setScanMsg('Starting the camera…');
    $('sc-photo-btn').hidden = true;
    $('sc-view').hidden = true;
    loadScript(LIB_JSQR).then(function () {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no camera api');
      return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
    }).then(function (stream) {
      if (state.page !== 'scan') { stream.getTracks().forEach(function (t) { t.stop(); }); return; }
      scan.stream = stream;
      var v = $('sc-video');
      v.srcObject = stream;
      v.setAttribute('playsinline', ''); v.muted = true;
      return v.play().then(function () {
        $('sc-view').hidden = false;
        setScanMsg('Point the camera at the booking QR code.');
        $('sc-photo-btn').hidden = false;                 // still offered as a backup
        $('sc-photo-btn').classList.add('ghost-alt');
        scanLoop();
      });
    }).catch(function (e) {
      // "Permissions policy violation: camera is not allowed", no camera, or permission denied
      if (/load/i.test(e && e.message || '')) { setScanMsg(e.message); }
      else { setScanMsg('Take a photo of the QR code.'); rememberPhotoMode(); }   // next time: phone camera at once
      stopCamera();
      $('sc-view').hidden = true;
      $('sc-photo-btn').hidden = false;
      $('sc-photo-btn').classList.remove('ghost-alt');
    });
  }

  function scanLoop() {
    var v = $('sc-video'), c = $('sc-canvas'), g = c.getContext('2d', { willReadFrequently: true });
    var last = 0;
    var tick = function (ts) {
      if (!scan.stream || state.page !== 'scan') return;
      if (v.readyState >= 2 && v.videoWidth && (!ts || ts - last > 120)) {
        last = ts || 0;
        var s = Math.min(v.videoWidth, v.videoHeight), n = Math.min(480, s);
        c.width = n; c.height = n;
        g.drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, n, n);
        var code = window.jsQR(g.getImageData(0, 0, n, n).data, n, n, { inversionAttempts: 'dontInvert' });
        if (code && code.data) { stopCamera(); return onScanned(code.data); }
      }
      scan.raf = requestAnimationFrame(tick);
    };
    scan.raf = requestAnimationFrame(tick);
  }

  function stopCamera() {
    if (scan.raf) cancelAnimationFrame(scan.raf);
    scan.raf = 0;
    if (scan.stream) scan.stream.getTracks().forEach(function (t) { t.stop(); });
    scan.stream = null;
    var v = $('sc-video'); if (v) { try { v.pause(); } catch (e) { /* ignore */ } v.srcObject = null; }
  }

  /** Fallback: photo from the phone's camera app → read the QR from the picture. */
  function onPhoto(e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setScanMsg('Reading the QR code…');
    loadScript(LIB_JSQR).then(function () {
      return new Promise(function (resolve, reject) {
        var img = new Image(), url = URL.createObjectURL(file);
        img.onload = function () { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('This picture could not be opened.')); };
        img.src = url;
      });
    }).then(function (img) {
      var c = $('sc-canvas'), g = c.getContext('2d', { willReadFrequently: true });
      // try the photo at a few sizes – big photos read better when scaled down
      var sizes = [1000, 1600, 700], code = null;
      for (var i = 0; i < sizes.length && !code; i++) {
        var sc = Math.min(1, sizes[i] / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * sc)), h = Math.max(1, Math.round(img.height * sc));
        c.width = w; c.height = h; g.drawImage(img, 0, 0, w, h);
        code = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      }
      if (!code || !code.data) { setScanMsg('No QR code found in the photo. Please try again – hold the phone closer and keep the QR sharp.'); return; }
      onScanned(code.data);
    }).catch(function (err) { setScanMsg(err.message); });
  }

  function setScanMsg(t) { $('sc-msg').textContent = t; }

  /** QR text → Booking Token (only links of this app / plain tokens are accepted). */
  function tokenFromQr(text) {
    text = String(text || '').trim();
    var m = text.match(/[?&]t=([A-Za-z0-9_-]{16,64})(?:&|#|$)/);
    if (m && /action=complete/.test(text)) return m[1];
    if (/^[A-Za-z0-9_-]{16,64}$/.test(text)) return text;
    return '';
  }
  /** QR text → Service Token of a Class QR (…?action=class&c=<token>), or ''. */
  function classTokenFromQr(text) {
    text = String(text || '').trim();
    var m = text.match(/[?&]c=([A-Za-z0-9_-]{16,64})(?:&|#|$)/);
    return m && /action=class/.test(text) ? m[1] : '';
  }

  function onScanned(text) {
    if (scan.busy) return;
    var ctok = classTokenFromQr(text), tok = ctok ? '' : tokenFromQr(text);
    if (!ctok && !tok) {
      setScanMsg('This QR code is not a Keryx Pilates QR code.');
      $('sc-photo-btn').hidden = hasLiveScanner();   // Scan again / Upload photo below instead
      $('sc-again').hidden = false; $('sc-upload').hidden = false;
      return;
    }
    scan.busy = true;
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
    $('sc-scan').hidden = true;
    if (ctok) showClassCheckIn(ctok); else showBookingCheckIn(tok);
  }

  /** Trainer / admin scanned a customer's Booking QR: details + "Check in" (nothing changes before the tap). */
  function showBookingCheckIn(tok) {
    var box = $('sc-result');
    clear(box); box.hidden = false;
    box.appendChild(el('div', { class: 'empty' }, icon('hourglass_empty'), 'Checking the booking…'));
    $('sc-again').hidden = false; $('sc-upload').hidden = false;
    call('lookupBookingQr', tok, auth()).then(function (r) {
      clear(box);
      if (!r.ok) { box.appendChild(el('div', { class: 'sc-bad' }, icon('error'), r.message)); return; }
      var v = r.booking;
      box.appendChild(el('h2', { class: 'sc-title' }, 'Booking ' + (v.bookingId || '')));
      if (v.restricted) {                          // no permission for this trainer's booking → no customer details
        box.appendChild(kv([['Booking ID', v.bookingId], ['Date', fmtDateLong(v.date)], ['Time', v.start + ' – ' + v.end], ['Service', v.service], ['Trainer', v.trainer]]));
        box.appendChild(el('div', { class: 'sc-bad' }, icon('block'), r.reason));
        return;
      }
      box.appendChild(kv([
        ['Booking ID', v.bookingId], ['Customer', v.name], ['Date', fmtDateLong(v.date)],
        ['Time', v.start + ' – ' + v.end], ['Service', v.service], ['Trainer', v.trainer],
        ['Booking Status', badge(v.status)], ['Class Status', ssBadge(v.classStatus)]
      ], 'compact'));
      if (r.canCheckIn) {
        box.appendChild(el('button', { class: 'btn primary block sc-done', type: 'button', id: 'sc-checkin',
          onclick: function () { doCheckIn('checkInByBookingQr', [tok], $('sc-checkin')); } }, icon('how_to_reg'), 'Check in'));
      } else {

  function showClassCheckIn(ctok) {

  /** Runs a check-in call and shows the result. fn = server function, args before the session token. */
  function doCheckIn(fn, args, btn) {
    if (btn) btn.disabled = true;
    return call.apply(null, [fn].concat(args, [auth()])).then(function (r) {
      if (!r.ok) {
        if (btn) btn.remove();
        if (state.page === 'scan') $('sc-result').appendChild(el('div', { class: 'sc-bad' }, icon('block'), r.message));
        else modal('Check in', r.message);
        return false;
      }
      clearCalCache();
      var v = r.booking;
      var buttons = state.page === 'scan'
        ? [{ label: 'Scan another', value: 'again', kind: 'ghost' }, { label: 'Done', value: 'done', kind: 'primary' }]
        : [{ label: 'Ok', value: 'done', kind: 'primary' }];
      return modal('Checked in', kv([
        ['Booking ID', v.bookingId], ['Customer', v.name], ['Class', v.service],
        ['Date', fmtDate(v.date) + ' · ' + v.start + '–' + v.end],
        ['Check in Time', v.checkInAt + (v.checkedInByName && isStaff() ? ' by ' + v.checkedInByName : '')]
      ], 'compact'), buttons).then(function (x) {
        if (state.page !== 'scan') return true;
        if (x !== 'again') { goMenu(); return true; }
        if (hasLiveScanner()) { openCamera(); return true; }   // back to the Live QR Scanner
        prepScanPage(); openScan();
        return true;
      });
    }).catch(function (e) { if (btn) btn.disabled = false; handleError(e); });
  }

  /** "Check in" button in Check/Cancel a Booking. */

    modal('Check in?', line, [{ label: 'No', value: false }, { label: 'Check in', value: true, kind: 'primary' }]).then(function (yes) {
      if (!yes) return;
      return doCheckIn('checkInBooking', [b.key], null).then(function (ok) { if (ok !== false) refreshCancelList(); });
    });
  }

  /** Trainer / admin: pick a class (service) and show its Class QR. */
  function chooseClassQr() {
    var svcs = (state.init.services || []);
    if (!svcs.length) return modal('Class QR', 'There are no classes you can show.');
    if (svcs.length === 1) return openClassQr(svcs[0].id);
    var sel = el('select', { id: 'cq-pick' });
    fillSelect(sel, svcs.map(function (x) { return { value: x.id, label: x.idName }; }), null);
    modal('Class QR', el('label', { class: 'field' }, el('span', null, 'Class'), sel),
      [{ label: 'Cancel', value: false }, { label: 'Show QR', value: true, kind: 'primary' }])
      .then(function (yes) { if (yes) openClassQr(sel.value); });
  }

  /** Trainer / admin: the Class QR of one service, large, with "Save as picture". */
  function openClassQr(serviceId) {
    return call('getClassQr', serviceId, auth()).then(function (r) {
      if (!r.ok) return modal('Class QR', r.message);
      var size = Math.min(260, Math.max(180, window.innerWidth - 120));
      var body = el('div', { class: 'cq-body' },
        el('p', { class: 'cq-name' }, r.service.idName),
        qrBlock(r.qrUrl, 'Customers scan this with the QR button in the app to check in.', size));
      return modal('Class QR', body, [{ label: 'Save as picture', value: 'save', kind: 'ghost' }, { label: 'Close', value: true, kind: 'primary' }])
        .then(function (v) { if (v === 'save') saveClassQr(r); });
    }).catch(handleError);
  }

  /** Class QR → PNG picture (name of the class above the code), downloaded / shared. */
  function saveClassQr(r) {
    loadScript(LIB_QR).then(function () {
      var q = window.qrcode(0, 'M'); q.addData(r.qrUrl); q.make();
      var n = q.getModuleCount(), cell = Math.max(8, Math.floor(720 / n)), qs = n * cell;
      var W = qs + 120, Hh = qs + 220;
      var c = document.createElement('canvas'); c.width = W; c.height = Hh;
      var g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, W, Hh);
      g.fillStyle = '#2D2A26'; g.textAlign = 'center';
      g.font = '700 40px "DM Sans", sans-serif'; g.fillText('Keryx Pilates – Class QR', W / 2, 64);
      g.font = '600 32px "DM Sans", sans-serif'; g.fillText(r.service.idName, W / 2, 112);
      for (var y = 0; y < n; y++) for (var x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(60 + x * cell, 150 + y * cell, cell, cell);
      var name = 'Class-QR-' + r.service.id + '.png';
      c.toBlob(function (blob) {
        var file = null;
        try { file = new File([blob], name, { type: 'image/png' }); } catch (e) { file = null; }
        if (file && navigator.canShare && navigator.canShare({ files: [file] }) && /Android|iPhone|iPad/i.test(navigator.userAgent)) {
          navigator.share({ files: [file], title: name }).catch(function () { /* cancelled */ });
          return;
        }
        var a = el('a', { href: URL.createObjectURL(blob), download: name, style: 'display:none' });
        document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    }).catch(function (e) { modal('Class QR', e.message); });
  }

  /** QR link opened with the phone's own camera (?action=complete&t=… / ?action=class&c=…): after sign-in. */
  var pendingAction = $('app').dataset.action;
  var pendingQr = (pendingAction === 'complete' && $('app').dataset.qr) ? $('app').dataset.qr : '';
  var pendingClass = (pendingAction === 'class' && $('app').dataset.qr) ? $('app').dataset.qr : '';
  /** Back from the Live QR Scanner (?action=scan&qr=<any QR text>); empty = "Back" was pressed. */
  var pendingScan = pendingAction === 'scan' ? ($('app').dataset.scan || '') : '';
  function runPendingQr() {
    if (!(pendingQr || pendingScan || pendingClass) || !state.user) return false;
    var tok = pendingQr, text = pendingScan, ctok = pendingClass; pendingQr = ''; pendingScan = ''; pendingClass = '';
    if (tok && !isStaff()) { modal('Check in', 'This is a booking QR code. To check in, please scan the Class QR code shown by the studio.'); return false; }
    show('scan'); prepScanPage(); $('sc-scan').hidden = true;
    if (tok) { scan.busy = true; showBookingCheckIn(tok); return true; }
    if (ctok) { scan.busy = true; showClassCheckIn(ctok); return true; }
    $('sc-scan').hidden = false;
    onScanned(text);                 // checks that the QR belongs to this app
    return true;
  }

  // ================================================================ MULTI-SELECT FILTER (calendar)
  /**
   * Checkbox dropdown with "Select all" at the top.
   * Nothing selected = everything selected (no filter).
   * opts: { title, icon, items(): [string], swatch?(item): colour, onChange() }
   */
  function MultiSelect(root, opts) {
    var sel = {};
    clear(root);
    var label = el('span', { class: 'multi-label' });
    var btn = el('button', { type: 'button', class: 'multi-btn', 'aria-haspopup': 'true', 'aria-expanded': 'false',
      onclick: function () { toggle(); } }, icon(opts.icon), label, icon('expand_more'));
    var panel = el('div', { class: 'multi-panel' });
    panel.hidden = true;
    append(root, [btn, panel]);

    function items() { return opts.items() || []; }
    function selected() { return items().filter(function (i) { return sel[i]; }); }
    function render() {
      clear(panel);
      var all = items(), on = selected().length;
      var allBox = el('input', { type: 'checkbox', checked: all.length > 0 && on === all.length,
        onchange: function (e) { all.forEach(function (i) { sel[i] = e.target.checked; }); changed(); } });
      allBox.indeterminate = on > 0 && on < all.length;
      panel.appendChild(el('label', { class: 'multi-opt multi-all' }, allBox, 'Select all'));
      all.forEach(function (i) {
        panel.appendChild(el('label', { class: 'multi-opt' },
          el('input', { type: 'checkbox', checked: !!sel[i], onchange: function (e) { sel[i] = e.target.checked; changed(); } }),
          opts.swatch ? el('i', { class: 'sw', style: '--c:' + opts.swatch(i) }) : null,
          i));
      });
    }
    function updateLabel() {
      var on = selected(), all = items();
      label.textContent = opts.title + ': ' + ((on.length === 0 || on.length === all.length) ? 'All'
        : on.length === 1 ? on[0] : on.length + ' selected');
    }
    function changed() { render(); updateLabel(); if (opts.onChange) opts.onChange(); }
    function toggle(force) {
      var open = force === undefined ? panel.hidden : force;
      panel.hidden = !open;
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    }
    render(); updateLabel();
    return {
      /** True if `v` passes the filter (nothing / everything selected → all pass). */
      matches: function (v) { var on = selected(); return on.length === 0 || on.length === items().length || !!sel[v]; },
      close: function () { toggle(false); },
      isOpen: function () { return !panel.hidden; },
      contains: function (n) { return root.contains(n); }
    };
  }

  // ================================================================ PAGE E – CALENDAR (ADMIN)
  function openCalendar() {
    if (!isStaff()) return goMenu();
    state.cal.anchor = state.init.today;
    setSeg('cv-views', 'v', state.cal.view);
    fillJump();
    show('calendar');
    loadCalendar();
  }

  function calRange() {
    var v = state.cal.view, a = state.cal.anchor, today = state.init.today;
    if (v === 'list') {
      var max = state.init.calMax && state.init.calMax > today ? state.init.calMax : addDays(today, 365);
      return { start: today, end: max };
    }
    if (v === 'day') return { start: a, end: a };
    if (v === 'week') { var s = startOfWeek(a); return { start: s, end: addDays(s, 6) }; }
    var first = a.slice(0, 8) + '01', last = lastOfMonth(first);
    return { start: startOfWeek(first), end: addDays(startOfWeek(last), 6), first: first, last: last };
  }

  function moveCalendar(dir) {
    var v = state.cal.view, a = state.cal.anchor;
    state.cal.anchor = v === 'month' ? addMonths(a, dir) : addDays(a, v === 'week' ? 7 * dir : dir);
    loadCalendar();
  }

  function calTitle(r) {
    var v = state.cal.view;
    if (v === 'list') return 'Upcoming bookings';
    if (v === 'day') return fmtDateLong(r.start);
    if (v === 'week') {
      var s = keyToUTC(r.start), e = keyToUTC(r.end);
      return s.getUTCDate() + ' ' + MONTHS[s.getUTCMonth()] + ' – ' + e.getUTCDate() + ' ' + MONTHS[e.getUTCMonth()] + ' ' + e.getUTCFullYear();
    }
    var f = keyToUTC(r.first);
    return MONTHS_FULL[f.getUTCMonth()] + ' ' + f.getUTCFullYear();
  }

  function loadCalendar() {
    var v = state.cal.view, r = calRange();
    $('cv-title').textContent = calTitle(r);
    $('cv-title').hidden = v === 'month';          // month view shows the month/year selectors instead
    $('cv-jump').hidden = v !== 'month';
    $('cv-nav').hidden = v === 'list';
    if (v === 'month') syncJump();
    // Show what we already have straight away, then refresh quietly in the background.
    var ck = r.start + '|' + r.end, hit = state.cal.cache[ck];
    if (hit) { state.cal.data = hit; state.cal.range = r; renderCalendar(); }
    (hit ? callQuiet : call)('getBookingsInRange', r.start, r.end, true, auth()).then(function (res) {
      if (!res.ok) return modal('Please check', res.message);
      state.cal.cache[ck] = res;
      var now = calRange();
      if (now.start !== r.start || now.end !== r.end || state.cal.view !== v) return;   // user moved on
      var same = hit && JSON.stringify(hit) === JSON.stringify(res);
      state.cal.data = res; state.cal.range = r;
      if (!same) renderCalendar();
    }).catch(handleError);
  }
  function clearCalCache() { state.cal.cache = {}; }

  // ---- month / year quick navigation
  function fillJump() {
    fillSelect($('cv-month'), MONTHS_FULL.map(function (n, i) { return { value: pad(i + 1), label: n }; }), null);
    var today = state.init.today;
    var y0 = Math.min(+(state.init.calMin || today).slice(0, 4), +today.slice(0, 4));
    var y1 = Math.max(+(state.init.calMax || today).slice(0, 4), +today.slice(0, 4));
    var years = [];
    for (var y = y0; y <= y1; y++) years.push({ value: String(y), label: String(y) });
    fillSelect($('cv-year'), years, null);
  }
  function syncJump() {
    var a = state.cal.anchor, ys = $('cv-year'), y = a.slice(0, 4);
    if (!Array.prototype.some.call(ys.options, function (o) { return o.value === y; })) {
      ys.appendChild(el('option', { value: y }, y));
      Array.prototype.slice.call(ys.options).sort(function (p, q) { return +p.value - +q.value; })
        .forEach(function (o) { ys.appendChild(o); });
    }
    ys.value = y;
    $('cv-month').value = a.slice(5, 7);
  }
  function jumpToMonth() {
    state.cal.anchor = $('cv-year').value + '-' + $('cv-month').value + '-01';
    loadCalendar();
  }

  /** Two colours only, so the legend stays short however many trainers there are. */
  var COLOR_NO_TRAINER = '#C47A5A', COLOR_WITH_TRAINER = '#5E8C7A';
  function colorFor(trainer) {
    return (!trainer || trainer === NO_TRAINER) ? COLOR_NO_TRAINER : COLOR_WITH_TRAINER;
  }

  function visibleCalBookings() {
    var showCx = $('cv-cancelled').checked, ft = state.filters.trainer, fs = state.filters.sstatus;
    return (state.cal.data ? state.cal.data.bookings : []).filter(function (b) {
      if (!showCx && isCancelled(b.status)) return false;
      if (ft && !ft.matches(b.trainer)) return false;
      if (fs && !fs.matches(b.classStatus)) return false;
      return true;
    });
  }
  function byDate(list) {
    var m = {};
    list.forEach(function (b) { (m[b.date] = m[b.date] || []).push(b); });
    Object.keys(m).forEach(function (k) { m[k].sort(function (a, b) { return a.startIdx - b.startIdx || b.endIdx - a.endIdx; }); });
    return m;
  }

  function renderLegend() {
    var lg = clear($('cv-legend'));
    lg.appendChild(el('span', null, el('i', { class: 'sw', style: '--c:' + COLOR_NO_TRAINER }), 'No Trainer'));
    lg.appendChild(el('span', null, el('i', { class: 'sw', style: '--c:' + COLOR_WITH_TRAINER }), 'With Trainer'));
  }

  function renderCalendar() {
    if (state.page !== 'calendar' || !state.cal.data || !state.cal.range) return;
    renderLegend();
    var v = state.cal.view;
    if (v === 'month') renderMonthView();
    else if (v === 'week') renderTimeGrid(daysBetween(state.cal.range.start, state.cal.range.end), false);
    else if (v === 'day') renderTimeGrid([state.cal.range.start], true);
    else renderListView();
  }

  function daysBetween(a, b) { var out = []; for (var k = a; k <= b; k = addDays(k, 1)) out.push(k); return out; }

  function bookingLabel(b) { return b.start + ' ' + b.name + ' – ' + (b.serviceId || b.service); }

  function renderMonthView() {
    var body = clear($('cv-body')), r = state.cal.range, map = byDate(visibleCalBookings());
    var grid = el('div', { class: 'mv' });
    DOW_MON.forEach(function (d) { grid.appendChild(el('div', { class: 'mv-dow' }, d)); });
    daysBetween(r.start, r.end).forEach(function (k) {

      var cell = el('div', {
        class: 'mv-cell' + (k < r.first || k > r.last ? ' out' : '') + (k === state.init.today ? ' today' : ''),
        role: 'button', tabindex: '0', 'aria-label': fmtDateLong(k) + ', ' + list.length + ' bookings',
        onclick: function () { openDay(k); },
        onkeydown: function (e) { if (e.key === 'Enter') openDay(k); }
      }, el('span', { class: 'mv-num' }, String(+k.slice(8, 10))));
      list.slice(0, 3).forEach(function (b) {
        cell.appendChild(el('button', {
          class: 'chip' + (isCancelled(b.status) ? ' is-cancelled' : ''), type: 'button',
          style: '--c:' + colorFor(b.trainer), title: bookingLabel(b),
          onclick: function (e) { e.stopPropagation(); showDetails(b); }
        }, bookingLabel(b)));
      });
      if (list.length > 3) {

  function openDay(k) {
    state.cal.view = 'day'; state.cal.anchor = k;

  function renderTimeGrid(days, isDay) {
    var body = clear($('cv-body')), map = byDate(visibleCalBookings());
    var data = state.cal.data, open = state.init.openHours;
    var lo = open.length ? open[0] : 8, hi = open.length ? open[open.length - 1] : 21;
    days.forEach(function (k) { (map[k] || []).forEach(function (b) { lo = Math.min(lo, b.startIdx); hi = Math.max(hi, b.endIdx); }); });
    var H = 84;                       // one hour – tall enough for name, time, service and trainer

    var grid = el('div', { class: 'tg', style: '--cols:' + days.length + ';--colw:' + (isDay ? '220px' : '140px') + ';--hour:' + H + 'px' });
    grid.appendChild(el('div', { class: 'tg-corner' }));
    days.forEach(function (k) {
      grid.appendChild(el('div', {
        class: 'tg-head' + (k === state.init.today ? ' today' : ''),
        onclick: isDay ? null : function () { openDay(k); }
      }, DOW[dow(k)], el('small', null, fmtDate(k))));
    });

    var times = el('div', { class: 'tg-times' });
    for (var i = lo; i <= hi; i++) {
      var t = el('div', { class: 'tg-time' }, idxStart(i));
      if (isDay) {
        var caps = data.capacity[days[0]];
        var used = caps ? caps[i - 1] || 0 : 0;
        t.appendChild(el('span', { class: 'cap' + (used >= data.maxRoom ? ' full' : ''), title: 'Rooms booked' }, used + '/' + data.maxRoom));
      }

    }
    grid.appendChild(times);

    days.forEach(function (k) {
      var col = el('div', { class: 'tg-col', style: 'height:' + ((hi - lo + 1) * H) + 'px' });
      var evs = map[k] || [];
      var laneEnd = [];
      evs.forEach(function (b) {
        var lane = laneEnd.findIndex(function (end) { return end < b.startIdx; });
        if (lane === -1) { lane = laneEnd.length; laneEnd.push(b.endIdx); } else laneEnd[lane] = b.endIdx;
        b._lane = lane;
      });
      var lanes = Math.max(1, laneEnd.length), w = 100 / lanes;
      evs.forEach(function (b) {
        var top = (b.startIdx - lo) * H, height = (b.endIdx - b.startIdx + 1) * H - 4;
        col.appendChild(el('button', {
          class: 'ev' + (isCancelled(b.status) ? ' is-cancelled' : ''), type: 'button',

          title: bookingLabel(b), onclick: function () { showDetails(b); }
        }, el('strong', null, b.name), el('span', null, b.start + '–' + b.end), el('span', null, b.serviceId || b.service), el('span', null, b.trainer),
          el('span', { class: 'ev-cs cs-' + String(b.classStatus || '').toLowerCase() }, b.classStatus || '')));
      });
      grid.appendChild(col);

    body.appendChild(el('div', { class: 'tg-scroll' }, grid));
  }

  /** List view: upcoming bookings only (start time after now), grouped by date. */

          style: '--c:' + colorFor(b.trainer), onclick: function () { showDetails(b); }
        },
          el('div', { class: 'lv-time' }, b.start + '–' + b.end, el('small', null, b.hours + (b.hours === 1 ? ' hr' : ' hrs'))),
          el('div', { class: 'lv-main' }, el('strong', null, b.name), el('span', null, b.service)),
          el('div', { class: 'lv-side' }, el('span', null, b.trainer), ssBadge(b.classStatus),
            b.status !== BOOKED ? badge(b.status) : null)));
      });
    });
    body.appendChild(wrap);
  }

  function showDetails(b) {
    var phone = b.phone ? el('a', { href: 'tel:' + b.phone }, fmtPhone(b.phone)) : '–';
    var buttons = [];
    if (isStaff() && b.checkIn && b.checkIn.can) buttons.push({ label: 'Check in', value: 'checkin', kind: 'primary' });
    if (isStaff() && b.status === BOOKED) buttons.push({ label: 'Edit', value: 'edit', kind: 'warn' });
    if (isStaff() && b.canCancelClass) buttons.push({ label: 'Cancel class', value: 'cancelclass', kind: 'danger' });
    buttons.push({ label: 'Close', value: 'close', kind: buttons.length && buttons[0].value === 'checkin' ? 'ghost' : 'primary' });
    // compact layout: related values share one row so the pop-up fits on a phone screen without scrolling
    var hrs = b.hours + (Number(b.hours) === 1 ? ' hr' : ' hrs');
    var svc = isStaff()
      ? el('span', { class: 'kv-with-btn' }, el('span', null, b.service),
          el('button', { class: 'kv-icon-btn', type: 'button', 'aria-label': 'Show Class QR', title: 'Show Class QR',
            onclick: function () { openClassQr(b.serviceId); } }, icon('qr_code_2')))
      : b.service;
    var rows = [
      ['Booking ID', b.bookingId || '–'],
      ['Customer', b.name], ['Phone', phone],
      ['Date', fmtDateLong(b.date)],
      ['Time', b.start + ' – ' + b.end + ' (' + hrs + ')'],
      ['Service', svc]
    ];
    // the trainer is usually already in the service name, e.g. "Studio with Trainer (Peun)"
    if (b.trainer && String(b.service || '').indexOf(b.trainer) === -1) rows.push(['Trainer', b.trainer]);
    if (isAdmin()) {      // prices are admin-only (trainers never receive them)
      rows.push(['Rate', fmtMoney(b.rate) + '/hr' + (Number(b.adjust) ? ' · adj. ' + fmtAdj(b.adjust) : '')],
        ['Income', fmtMoney(b.income)]);
    }
    // Booking Status (admin: pencil to switch Checked in ⇄ No show) and Class Status – separate rows
    rows.push(['Booking Status', el('span', { class: 'kv-with-btn' }, badge(b.status),
      b.canSetAttendance ? el('button', { class: 'kv-icon-btn', type: 'button', 'aria-label': 'Change booking status', title: 'Change booking status',
        onclick: function () { openAttendance(b); } }, icon('edit')) : null)]);
    rows.push(['Class Status', ssBadge(b.classStatus)]);
    if (b.checkInAt) rows.push(['Checked in', b.checkInAt + (b.checkInMethod ? ' (' + b.checkInMethod + ')' : '') + (b.checkedInByName ? ' · ' + b.checkedInByName : '')]);
    else if (b.checkIn && !b.checkIn.can) rows.push(['Check-in', el('span', { class: 'muted' }, b.checkIn.reason)]);
    if (b.classStatus === 'Completed' && b.completedAt) rows.push(['Completed', b.completedAt]);
    rows.push(['Booked on', b.bookedAt || '–']);
    if (b.cancelledAt) rows.push(['Cancelled on', b.cancelledAt]);
    var shown = modal('Booking Details', kv(rows, 'compact'), buttons);
    $('modal-root').classList.add('details-modal');
    shown.then(function (v) {
      $('modal-root').classList.remove('details-modal');
      if (v === 'edit') openEdit(b);
      else if (v === 'checkin') doCheckIn('checkInBooking', [b.key], null).then(function (ok) { if (ok !== false) loadCalendar(); });
      else if (v === 'cancelclass') cancelClassFromCalendar(b);
    });
  }

  /** Trainer / admin: "Cancel class" – cancels this booking (Booking and Class Status → Cancelled). */
  function cancelClassFromCalendar(b) {
    var body = el('div', null,
      el('p', null, 'Cancel this class? The booking will be cancelled.'),
      el('ul', { class: 'mini-list' }, el('li', null, b.name + ' · ' + fmtDate(b.date) + ' · ' + b.start + '–' + b.end + ' · ' + b.service)));
    modal('Cancel class', body, [{ label: 'No', value: false }, { label: 'Cancel class', value: true, kind: 'danger' }])
      .then(function (yes) {

          clearCalCache();
          if (!r.ok) return modal('Please check', r.message).then(loadCalendar);

        });

  /** ADMIN: switch Booking Status between Checked in and No show (Class Status follows the rules). */
  function openAttendance(b) {
    var sel = el('select', { class: 'ss-pick', id: 'att-pick', 'aria-label': 'Booking status' });
    fillSelect(sel, [CHECKED_IN, NO_SHOW].map(function (x) { return { value: x, label: x }; }), null);
    sel.value = b.status;
    var body = el('div', null,
      el('p', null, b.name + ' · ' + fmtDate(b.date) + ' · ' + b.start + '–' + b.end),

    modal('Change booking status', body, [{ label: 'Cancel', value: false }, { label: 'Save', value: true, kind: 'primary' }])
      .then(function (yes) {

  /** Cancel one booking from the calendar – same steps as the Check/Cancel a Booking page. */
  function cancelFromCalendar(b) {
    var body = el('div', null,
      el('p', null, 'Cancel the following booking?'),
      el('ul', { class: 'mini-list' }, el('li', null, b.name + ' · ' + fmtDate(b.date) + ' · ' + b.start + '–' + b.end + ' · ' + b.service)));
    modal('Confirm cancellation', body, [{ label: 'No', value: false }, { label: 'Yes', value: true, kind: 'danger' }])
      .then(function (yes) {
        if (!yes) return;
        // the booking's own phone number is the search key the server re-checks
        return call('cancelBookings', [b.key], '', auth()).then(function (r) {
          if (!r.ok) return modal('Please check', r.message);
          clearCalCache();
          if (!r.cancelled) {
            return modal('Nothing was cancelled', 'This booking was already cancelled, has already started, or is completed.').then(loadCalendar);
          }

  // ================================================================ EDIT BOOKING POP-UP (ADMIN)
  function openEdit(b) {
    if (state.edit.form) state.edit.form.destroy();
    state.edit.booking = b;
    $('edit-sub').textContent = b.name + ' · ' + fmtDate(b.date) + ' · ' + b.start + '–' + b.end;
    $('edit-confirm').disabled = true;
    $('edit-root').hidden = false;
    document.body.classList.add('no-scroll');
    state.edit.form = BookingForm($('edit-form'), {
      initial: b,
      excludeKey: b.key,
      priceAdjust: isAdmin(),        // trainers can't see or change prices
      onChange: function (ok) { $('edit-confirm').disabled = !ok; }
    });
  }

  /** "Cancel" – close without applying any change. */
  function closeEdit() {
    if (state.edit.form) state.edit.form.destroy();
    state.edit.form = null;
    state.edit.booking = null;
    clear($('edit-form'));
    $('edit-root').hidden = true;
    document.body.classList.remove('no-scroll');
  }

  function confirmEdit() {
    var b = state.edit.booking, p = state.edit.form && state.edit.form.payload();
    if (!b || !p) return;
    var rows = [
      ['Name', b.name, p.name],
      ['Telephone', fmtPhone(b.phone), fmtPhone(p.phone)],
      ['Service', b.service, p.service],
      ['Date', fmtDate(b.date), fmtDate(p.date)],
      ['Time', b.start + ' – ' + b.end, idxStart(p.startIdx) + ' – ' + idxEnd(p.endIdx)]
    ];
    if (isAdmin()) rows.push(
      ['Rate per Hour', fmtMoney(b.rate), fmtMoney(p.rate)],
      ['Price Adjustment', fmtAdj(b.adjust), fmtAdj(p.adjust)]);
    var changes = rows.filter(function (r) { return r[1] !== r[2]; });
    if (!changes.length) return modal('No changes', 'Nothing has been changed in this booking yet.');

    var body = el('div', null,
      el('p', null, 'Apply the following ' + (changes.length === 1 ? 'change?' : 'changes?')),
      kv(changes.map(function (r) {
        return [r[0], el('span', null, el('span', { class: 'was' }, r[1]), el('span', { class: 'arrow' }, '→'), el('strong', null, r[2]))];
      }), 'chg'));

    modal('Confirm change', body, [{ label: 'No', value: false }, { label: 'Yes', value: true, kind: 'primary' }])
      .then(function (yes) {
        if (!yes) return;                                   // "No" → back to the editing pop-up
        return call('updateBooking', b.key, p, auth()).then(function (r) {
          if (r.ok) {
            closeEdit();
            clearCalCache();
            var bk = r.booking;
            var done = [['Name', bk.name], ['Date', fmtDateLong(bk.date)], ['Time', bk.start + ' – ' + bk.end], ['Service', bk.service]];
            if (isAdmin()) done.push(['Price Adjustment', fmtAdj(bk.adjust)], ['Service Income', fmtMoney(bk.income)]);
            return modal('The booking has been updated', kv(done), [{ label: 'Ok', value: true, kind: 'primary' }]).then(loadCalendar);
          }
          if (r.code === 'UNAVAILABLE') {
            return modal('Time not available', r.message).then(function () { if (state.edit.form) state.edit.form.reload(); });
          }
          if (r.code === 'CHANGED') {
            return modal('Booking changed', r.message).then(function () { closeEdit(); clearCalCache(); loadCalendar(); });
          }
          return modal('Please check', r.message);
        });
      }).catch(handleError);
  }

  // ================================================================ PAGE F – MASTER DATA (ADMIN)
  function openMaster() {
    if (!isAdmin()) return goMenu();
    state.md = { name: '', data: null, edits: {}, orig: {}, adds: [], delMode: false, del: {}, q: '', open: {}, view: mdView() };
    setMdViewButtons();
    fillSelect($('md-table'), state.init.masters.map(function (m) { return { value: m.name, label: m.label }; }), 'Select master data…');
    renderMaster();
    show('master');
  }

  function masterDirtyCount() { return Object.keys(state.md.edits).length + state.md.adds.length; }
  function resetMasterEdits() {
    state.md.edits = {}; state.md.orig = {}; state.md.adds = [];
    state.md.delMode = false; state.md.del = {}; state.md.open = {};
  }

  // ---- List / Card view switch (remembered on this device)
  function mdView() { try { return localStorage.getItem('kp_md_view') === 'list' ? 'list' : 'card'; } catch (e) { return 'card'; } }   // Card view is the default
  /** Card view is offered for real tables only – not for Days (list only) or one-row forms (Maximum rooms). */
  function mdCardsAllowed(d) { return !!(d && d.layout !== 'form' && !d.listOnly); }
  function setMdViewButtons() {
    var md = state.md || {};
    $('md-view').hidden = !(md.name && mdCardsAllowed(md.data));    // no switch on the table-selection screen either
    $('md-view').querySelectorAll('button').forEach(function (b) {
      var on = b.dataset.v === state.md.view;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function switchMdView(v) {
    if (v === state.md.view) return;
    state.md.view = v;
    try { localStorage.setItem('kp_md_view', v); } catch (e) { /* ignore */ }
    state.md.delMode = false; state.md.del = {};          // delete mode is a list-view tool
    setMdViewButtons();
    renderMaster();                                       // unsaved changes are kept in both views
  }

  /** Asks before throwing away unsaved changes. Resolves true when it is OK to continue. */
  function confirmDiscardMaster() {
    if (!masterDirtyCount()) return Promise.resolve(true);
    return modal('Discard changes?', 'You have unsaved changes in ' + (state.md.data ? state.md.data.label : 'this table') + '.',
      [{ label: 'Keep editing', value: false }, { label: 'Discard', value: true, kind: 'danger' }]);
  }

  function backFromMaster() {
    confirmDiscardMaster().then(function (ok) { if (ok) { resetMasterEdits(); goMenu(); } });
  }

  function onMasterSelect() {
    var name = $('md-table').value;
    confirmDiscardMaster().then(function (ok) {
      if (!ok) { $('md-table').value = state.md.name; return; }
      resetMasterEdits();
      state.md.name = name;
      state.md.data = null;
      state.md.q = '';
      renderMaster();
      if (name) loadMaster(name);
    });
  }

  function loadMaster(name) {
    return call('getMasterData', name, state.token).then(function (r) {
      if (!r.ok) return modal('Please check', r.message);
      if (name !== state.md.name) return;
      state.md.data = r;
      resetMasterEdits();
      renderMaster();
    }).catch(handleError);
  }

  /**
   * Light colours for dropdowns: Open / Available green, Close / Not available red;
   * User Profile: Role, Status (Active green, Inactive grey) and the two Visibility columns.
   */
  var CHOICE_COLORS = { customer: 'md-c-green', trainer: 'md-c-amber', admin: 'md-c-blue',
                        active: 'md-c-green', inactive: 'md-c-grey', all: 'md-c-teal', user: 'md-c-lilac' };
  function paintChoice(inp, colored) {
    var v = String(inp.value || '').trim().toLowerCase();
    inp.classList.toggle('md-ok', v === 'open' || v === 'available');
    inp.classList.toggle('md-no', v === 'close' || v === 'closed' || v === 'not available');
    Object.keys(CHOICE_COLORS).forEach(function (k) { inp.classList.remove(CHOICE_COLORS[k]); });
    if (colored && CHOICE_COLORS[v]) inp.classList.add(CHOICE_COLORS[v]);
  }
  /**
   * Makes a phone box exactly as wide as "000-000-0000" in the font the device
   * really uses, plus the same space on the left and right.
   */
  function fitPhoneBox(inp) {
    var fit = function () {
      if (!inp.isConnected) return;
      var cs = getComputedStyle(inp);
      // measure with a hidden copy of the text in exactly the same font settings
      var probe = fitPhoneBox.probe || (fitPhoneBox.probe = el('span', { 'aria-hidden': 'true',
        style: 'position:absolute;left:-9999px;top:0;white-space:pre;visibility:hidden' }));
      if (!probe.isConnected) document.body.appendChild(probe);
      ['fontFamily', 'fontSize', 'fontWeight', 'letterSpacing', 'fontVariantNumeric', 'fontFeatureSettings'].forEach(function (k) { probe.style[k] = cs[k]; });
      probe.textContent = '000-000-0000';
      var text = probe.getBoundingClientRect().width;
      probe.textContent = inp.value || '';
      text = Math.max(text, probe.getBoundingClientRect().width);
      var side = 10, border = parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
      var w = Math.ceil(text) + side * 2 + Math.ceil(border);
      ['width', 'min-width', 'max-width'].forEach(function (k) { inp.style.setProperty(k, w + 'px', 'important'); });
      ['padding-left', 'padding-right'].forEach(function (k) { inp.style.setProperty(k, side + 'px', 'important'); });
    };
    requestAnimationFrame(fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);   // again once the app font has loaded
  }

  /** Columns that share one fixed width (Customer Visibility / Trainer Visibility). */
  function isEqualCol(c) { return /visibility$/i.test(c.name); }
  function autoGrow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  /** One editable cell input. onChange receives the value as text. */
  function cellInput(col, value, onChange, wrap) {
    var inp;
    if (col.type === 'DROPDOWN' && col.options) {
      inp = el('select', { class: 'md-in' });
      var opts = col.options.slice();
      if (value && opts.indexOf(value) === -1) opts.unshift(value);
      fillSelect(inp, opts.map(function (o) { return { value: o, label: o }; }), '');
      inp.value = value || '';
      // wide enough for the longest choice plus the arrow (e.g. "Not available", "NoTrainer")
      var longest = opts.reduce(function (m, o) { return Math.max(m, String(o).length); }, 4);
      if (!isEqualCol(col)) inp.style.minWidth = Math.round(longest * 8.6 + 52) + 'px';
      paintChoice(inp, col.colored);
      inp.addEventListener('change', function () { paintChoice(inp, col.colored); onChange(inp.value); });
      return inp;
    }
    if (col.type === 'SECRET') {
      // the PIN itself is never shown – typing 6 digits sets a new PIN for the user
      var isSet = value === '••••••';
      inp = el('input', { class: 'md-in narrow secret', type: 'text', inputmode: 'numeric', autocomplete: 'off', maxlength: '6',
        placeholder: isSet ? 'Set' : 'Not set', title: 'Type 6 digits to give this user a new PIN' });
      inp.addEventListener('input', function () {
        inp.value = inp.value.replace(/\D/g, '').slice(0, 6);
        onChange(inp.value === '' ? value : inp.value);
      });
      return inp;
    }
    if (col.type === 'PHONE') {
      inp = el('input', { class: 'md-in phone', type: 'tel', inputmode: 'numeric', maxlength: '12', value: fmtPhone(value) });
      fitPhoneBox(inp);
      inp.addEventListener('input', function () { formatPhoneInput(inp); onChange(phoneDigits(inp.value)); });
      return inp;
    }
    if (wrap && col.type === 'TEXT') {
      inp = el('textarea', { class: 'md-in', rows: '1' });
      inp.value = value || '';
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') e.preventDefault(); });   // one line of data
      inp.addEventListener('input', function () {
        if (/\n/.test(inp.value)) inp.value = inp.value.replace(/\s*\n\s*/g, ' ');
        autoGrow(inp); onChange(inp.value);
      });
      requestAnimationFrame(function () { autoGrow(inp); });
      return inp;
    }
    if (col.type === 'NUMBER') {
      // shown with thousands separators (1,500); saved as a plain number
      inp = el('input', { class: 'md-in narrow num', type: 'text', inputmode: 'decimal', autocomplete: 'off', value: fmtNum(value) });
      inp.addEventListener('input', function () { formatNumberInput(inp); onChange(inp.value.replace(/,/g, '')); });
      return inp;
    }
    var type = col.type === 'DATE' ? 'date' : col.type === 'TIME' ? 'time' : 'text';
    inp = el('input', { class: 'md-in', type: type, value: value || '' });
    if (type === 'time') inp.setAttribute('step', '60');
    inp.addEventListener('input', function () { onChange(inp.value); });
    inp.addEventListener('change', function () { onChange(inp.value); });
    return inp;
  }

  function setCellEdit(k, v, orig) {
    var md = state.md;
    if (String(v) === String(orig)) { delete md.edits[k]; delete md.orig[k]; }
    else { md.edits[k] = v; md.orig[k] = orig; }
    updateMasterButtons();
    var p = k.split('|');
    refreshLookups(p[0], p.slice(1).join('|'), v);
  }

  /**
   * Read-only lookup columns (e.g. Trainer Profile → User Name from User ID):
   * value for a row, and live update when the source value is changed.
   */
  function lookupText(c, srcValue) { return (c.lookup && c.lookup.map[String(srcValue || '').trim()]) || ''; }
  function refreshLookups(rowKey, colName, value) {
    var d = state.md.data; if (!d) return;
    d.columns.forEach(function (c) {
      if (!c.lookup || c.lookup.from !== colName) return;
      var t = lookupText(c, value);
      $('md-body').querySelectorAll('[data-lk="' + rowKey + '|' + c.name + '"]').forEach(function (n) { n.textContent = t || '–'; });
    });
  }

  /** Text shown for a read-only cell. */
  function cellText(c, v) {
    if (c.type === 'SECRET') return v ? 'Set' : 'Not set';
    if (v === '' || v == null) return '–';
    if (c.type === 'PHONE') return fmtPhone(v);
    if (c.type === 'NUMBER') return fmtNum(v);
    return String(v);
  }

  /** "1500" → "1,500" (keeps decimals; anything that isn't a number is left as is). */
  function fmtNum(v) {
    var s = String(v == null ? '' : v).replace(/,/g, '').trim();
    if (!/^-?\d*(\.\d*)?$/.test(s) || s === '' || s === '-') return s;
    var neg = s.charAt(0) === '-'; if (neg) s = s.slice(1);
    var parts = s.split('.');
    var int = (parts[0] || '0').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + int + (parts.length > 1 ? '.' + parts[1] : '');
  }
  /** Re-formats a number box with commas while typing, keeping the caret in place. */
  function formatNumberInput(inp) {
    var raw = inp.value, pos = inp.selectionStart || raw.length;
    var clean = raw.replace(/[^\d.]/g, '');
    var dot = clean.indexOf('.');
    if (dot !== -1) clean = clean.slice(0, dot + 1) + clean.slice(dot + 1).replace(/\./g, '');
    var before = raw.slice(0, pos).replace(/[^\d.]/g, '').length;
    inp.value = fmtNum(clean);
    var p = 0, seen = 0;
    while (p < inp.value.length && seen < before) { if (/[\d.]/.test(inp.value.charAt(p))) seen++; p++; }
    try { inp.setSelectionRange(p, p); } catch (e) { /* not focused */ }
  }

  function renderMaster() {
    var body = clear($('md-body')), md = state.md, d = md.data;
    updateMasterButtons();
    setMdViewButtons();
    if (!md.name) { body.appendChild(el('div', { class: 'empty' }, icon('database'), 'Choose which master data to view and edit.')); return; }
    if (!d) return;
    if (d.layout === 'form' && d.rows.length === 1) { renderMasterForm(body, d); return; }
    if (md.view === 'card' && mdCardsAllowed(d)) { renderMasterCards(body, d); return; }

    var wrapSet = {};
    (d.wrap || []).forEach(function (w) { wrapSet[w] = true; });
    d.columns.forEach(function (c) { c.colored = (d.colors || []).indexOf(c.name) !== -1; });
    var nFrz = d.fit ? 0 : (d.freeze || 0);        // # plus the first n columns stay visible
    var frz = nFrz > 0;
    var showX = !md.delMode && md.adds.length > 0;   // column with "remove new row" buttons

    var tools = masterTools(d);
    if (tools) body.appendChild(tools);

    var table = el('table', { class: 'md-table' + (d.fit ? ' md-fit' : '') });

    // fixed column widths so the Holidays table fits the screen
    if (d.fit) {
      // widths come from CSS classes (different on phone and PC); text columns share the rest
      var cg = el('colgroup');
      if (md.delMode) cg.appendChild(el('col', { class: 'c-sel' }));
      cg.appendChild(el('col', { class: 'c-rn' }));
      d.columns.forEach(function (c) {
        var cls = c.type === 'DATE' ? 'c-date' : c.type === 'DROPDOWN' ? 'c-drop' : c.type === 'TIME' ? 'c-time' : c.type === 'NUMBER' ? 'c-num' : 'c-text';
        cg.appendChild(el('col', { class: cls }));
      });
      if (showX) cg.appendChild(el('col', { class: 'c-x' }));
      table.appendChild(cg);
    }

    if (none) none.remove();
    if (q && !shown) {
      var sc = $('md-body').querySelector('.md-scroll, .mdc-grid');
      if (sc) sc.parentNode.insertBefore(el('div', { class: 'empty md-none', id: 'md-none' }, icon('search_off'), 'No rows match "' + state.md.q.trim() + '".'), sc.nextSibling);
    }
  }

  function updateDelButton() {
    var b = $('md-del-go'), n = Object.keys(state.md.del).length;
    if (!b) return;
    b.disabled = n === 0;
    b.lastChild.nodeValue = 'Delete (' + n + ')';
  }

  function startDeleteMode() {
    if (masterDirtyCount()) {
      return modal('Unsaved changes', 'Please save or discard your changes before deleting rows.');
    }
    state.md.delMode = true;
    state.md.del = {};
    renderMaster();
  }

  function deleteSelectedRows() {
    var md = state.md, d = md.data;
    var chosen = d.rows.filter(function (r) { return md.del[r.row]; });
    if (!chosen.length) return;
    if (chosen.length >= d.rows.length) {
      return modal('Cannot delete', 'At least one row must stay in ' + d.label + ' (it is the template for new rows).');
    }
    var keyIdx = -1;
    d.columns.forEach(function (c, i) { if (c.key && keyIdx < 0) keyIdx = i; });
    var describe = function (r) {
      return d.columns.map(function (c, i) { return { c: c, v: r.values[i] }; })
        .filter(function (x) { return !x.c.formula && x.v !== ''; }).slice(0, 3)
        .map(function (x) { return cellText(x.c, x.v); }).join(' · ');
    };
    var body = el('div', null,
      el('p', null, 'Delete ' + chosen.length + (chosen.length === 1 ? ' row' : ' rows') + ' from ' + d.label + '? This cannot be undone.'),
      el('ul', { class: 'chg-list' }, chosen.map(function (r) { return el('li', null, describe(r)); })));
    modal('Confirm delete', body, [{ label: 'No', value: false }, { label: 'Yes, delete', value: true, kind: 'danger' }])
      .then(function (yes) {
        if (!yes) { if (!md.delMode) md.del = {}; return; }
        var items = chosen.map(function (r) { return { row: r.row, key: keyIdx >= 0 ? r.values[keyIdx] : '' }; });
        return call('deleteMasterRows', md.name, items, state.token).then(function (r) {
          if (!r.ok) return modal('Please check', r.message);
          clearCalCache();
          return modal('Rows deleted', r.deleted + (r.deleted === 1 ? ' row was deleted.' : ' rows were deleted.'))
            .then(function () {
              resetMasterEdits();
              return Promise.all([loadMaster(md.name), loadInit()]);
            });
        });
      }).catch(handleError);
  }

  function addMasterRow() {
    var d = state.md.data; if (!d) return;
    var row = {}, defs = d.defaults || {};
    d.columns.forEach(function (c) {
      if (defs[c.name] !== undefined) row[c.name] = defs[c.name];                     // e.g. Customer / Active / User / All
      else if (c.type === 'DROPDOWN' && c.options && c.options.length) row[c.name] = c.options[0];
    });
    state.md.adds.push(row);
    renderMaster();
    var rows = $('md-body').querySelectorAll('tr.new, .mdc.new');
    var last = rows[rows.length - 1];
    if (last) {
      last.scrollIntoView({ block: 'nearest' });
      var f = last.querySelector('input, select, textarea'); if (f) f.focus();
    }
  }

  function updateMasterButtons() {
    var n = masterDirtyCount();
    $('md-save').disabled = n === 0;
    $('md-discard').disabled = n === 0;
    $('md-save').textContent = n ? 'Save changes (' + n + ')' : 'Save changes';
  }

  /** Shows every change in a confirmation pop-up, then saves on "Yes". */
  function saveMaster() {
    var md = state.md, d = md.data;
    if (!d || !masterDirtyCount()) return;
    var shown = function (c, v) {
      if (c && c.type === 'SECRET') return v === '••••••' ? 'Set' : v ? 'new PIN ••••••' : 'Not set';
      return c && c.type === 'PHONE' ? fmtPhone(v) : (v === '' || v == null ? '(blank)' : String(v));
    };
    var colOf = function (n) { return d.columns.filter(function (c) { return c.name === n; })[0]; };
    var rowNo = {};
    d.rows.forEach(function (r, i) { rowNo[r.row] = i + 1; });

    var edits = Object.keys(md.edits).map(function (k) {
      var p = k.split('|');
      return { row: +p[0], col: p.slice(1).join('|'), value: md.edits[k], original: md.orig[k] };
    });
    var items = edits.map(function (e) {
      var c = colOf(e.col);
      return el('li', null, (d.rows.length > 1 ? 'Row ' + rowNo[e.row] + ' · ' : '') + ((c && c.label) || e.col) + ': ',
        el('span', { class: 'was' }, shown(c, e.original)), ' → ', el('strong', null, shown(c, e.value)));
    });
    md.adds.forEach(function (a, i) {
      var parts = d.columns.filter(function (c) { return !c.formula && a[c.name]; })
        .map(function (c) { return (c.label || c.name) + ': ' + shown(c, a[c.name]); });
      items.push(el('li', null, el('strong', null, 'New row ' + (i + 1) + ' – '), parts.join(' · ') || '(empty)'));
    });

    var body = el('div', null,
      el('p', null, 'Update ' + d.label + ' with the following ' + (items.length === 1 ? 'change?' : items.length + ' changes?')),
      el('ul', { class: 'chg-list' }, items));
    modal('Confirm update', body, [{ label: 'No', value: false }, { label: 'Yes', value: true, kind: 'primary' }])
      .then(function (yes) {
        if (!yes) return;
        return call('saveMasterData', md.name, edits, md.adds, state.token).then(function (r) {
          if (!r.ok) return modal('Please check', r.message);
          clearCalCache();
          var msg = [];
          if (r.updated) msg.push(r.updated + (r.updated === 1 ? ' cell updated.' : ' cells updated.'));
          if (r.added) msg.push(r.added + (r.added === 1 ? ' row added.' : ' rows added.'));
          if (r.cascaded) msg.push('The new phone number was also updated on ' + r.cascaded + (r.cascaded === 1 ? ' booking.' : ' bookings.'));
          return modal('Master data updated', msg.join('\n'), [{ label: 'Ok', value: true, kind: 'primary' }])
            .then(function () {
              resetMasterEdits();
              return Promise.all([loadMaster(md.name), loadInit()]);
            });
        });
      }).catch(handleError);
  }

  // ---------------------------------------------------------------- go
  start();
})();
</script>

</body>
</html>
